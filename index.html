/* ---- Festival fee rule (the contract) vs what was invoiced ----
   The invoice stays the source of the amount paid. The rule only says what should have been charged,
   so the app can flag a difference. Own-sale events: commission is invoiced. Service-provision events:
   the organizer keeps its commission before paying, so it is not an invoice and only the fixed part is expected. */
const HAS_CONTRACT_COLS = () => DATA.events.length ? ('revenue_model' in DATA.events[0]) : true;
function feeRuleIsSet(e){
  return Number(e.fee_fixed_amount||0)>0 || Number(e.fee_commission_food_pct||0)>0 || Number(e.fee_commission_drinks_pct||0)>0;
}
function feeAnalysis(e){
  const model = e.fee_model || 'fixed';
  const own = (e.revenue_model || 'own_sale') === 'own_sale';
  const fixed = Number(e.fee_fixed_amount||0), fp = Number(e.fee_commission_food_pct||0), dp = Number(e.fee_commission_drinks_pct||0);
  const lines = salesLinesForEvent(e.id);
  const useGross = e.fee_base === 'gross';
  let food = 0, drinks = 0;
  if(lines.length){
    lines.forEach(l=>{
      const v = useGross ? Number(l.amount_gross ?? l.amount_net ?? 0) : Number(l.amount_net||0);
      if(l.category_normalized==='drinks') drinks += v; else food += v;   // "other" lines (deposits, vouchers) take the food rate
    });
  } else {
    food = useGross ? Number(e.sales_gross_manual ?? e.sales_net_manual ?? 0) : Number(e.sales_net_manual ?? 0);
  }
  const fixedPart = model==='commission' ? 0 : fixed;
  const commPart = (model==='fixed' || !own) ? 0 : food*fp/100 + drinks*dp/100;
  const expected = fixedPart + commPart;
  // Payment-terminal / processor fees (Zig, SIBS...) sit in category "fee" but are not the organizer's canon: leave them out of the check only.
  const PROC = /zig|sibs|sumup|stripe|paypal|payment|terminal|multibanco/i;
  const autoStaffIds = new Set(DATA.receipts.filter(r=>autoKind(r)==='staff').map(r=>r.id));
  const orgLines = linesForEvent(e.id, ['fee']).filter(l=>{
    if(autoStaffIds.has(l.receipt_id)) return false;
    const r = DATA.receipts.find(x=>x.id===l.receipt_id);
    return !(r && PROC.test(vendorName(r.vendor_id)||''));
  });
  const invoiced = orgLines.reduce((s,l)=>s+Number(l.amount||0),0);
  const hasInvoice = orgLines.length > 0;
  const revenue = eventRevenue(e);
  const withheldPct = !own ? fp : 0;
  const publicBase = (!own && withheldPct>0 && withheldPct<100) ? revenue/(1-withheldPct/100) : revenue;
  const retained = publicBase - revenue;
  const effective = publicBase ? (invoiced + retained)/publicBase : NaN;
  const diff = invoiced - expected;
  const level = !hasInvoice ? 'none' : (Math.abs(diff) <= 5 ? 'good' : (Math.abs(diff) <= 50 ? 'warn' : 'bad'));
  const baseUnverified = (model!=='fixed' && own && !e.fee_base);
  return { model, own, fixed, fp, dp, food, drinks, fixedPart, commPart, expected, invoiced, hasInvoice, revenue, publicBase, retained, effective, diff, level, baseUnverified, set: feeRuleIsSet(e) };
}
function feeRuleText(e, a){
  const parts = [];
  if(a.model!=='commission' && a.fixed) parts.push(`fixed ${fmt2(a.fixed)}`);
  if(a.model!=='fixed'){
    const c = [];
    if(a.fp) c.push(`${a.fp}% food`); if(a.dp) c.push(`${a.dp}% drinks`);
    if(c.length) parts.push(c.join(' + ') + (a.own ? ' of sales' : ' withheld by the organizer before paying'));
  }
  const base = e.fee_base==='gross' ? 'on gross (with IVA)' : e.fee_base==='net' ? 'on net (without IVA)' : 'base not verified';
  return (parts.join(' + ') || 'no amounts') + ((a.model!=='fixed') ? ', ' + base : '');
}
function feeCheckPill(e){
  const a = feeAnalysis(e);
  if(!a.set) return '<span class="pill">—</span>';
  if(!a.hasInvoice) return '<span class="pill warn">No invoice</span>';
  const t = (a.diff>=0?'+':'') + fmt2(a.diff);
  return `<span class="pill ${a.level}" title="Invoiced ${fmt2(a.invoiced)} vs expected ${fmt2(a.expected)}">${a.level==='good'?'OK ':'Check '}${t}</span>`;
}
function feePanelHtml(e){
  const a = feeAnalysis(e);
  const invoicedLine = a.hasInvoice
    ? `<b>${fmt2(a.invoiced)}</b> <span class="small muted">(net of deductible IVA, from the fee invoices)</span>`
    : `<span class="pill warn">No fee invoice yet</span> <span class="small muted">The margin above doesn't include the festival fee until you add it in Expenses.</span>`;
  let rule = '';
  if(HAS_CONTRACT_COLS()){
    if(!a.set){
      rule = `<div class="small muted" style="margin:6px 0">Contract rule not set. Open the event (Events → click it) and fill in the Contract section to check the fee against it.</div>`;
    } else {
      const sev = a.level==='none' ? '' : `<span class="pill ${a.level}">${a.level==='good'?'OK':'Check'} ${(a.diff>=0?'+':'')+fmt2(a.diff)}</span>`;
      rule = `
        <div style="margin:6px 0">Contract rule: <b>${esc(feeRuleText(e,a))}</b>${a.own?'':' <span class="pill">service provision</span>'}</div>
        <div style="margin:6px 0">Expected fee: <b>${fmt2(a.expected)}</b> ${a.hasInvoice ? `· invoiced <b>${fmt2(a.invoiced)}</b> · difference ${sev}` : '<span class="small muted">(not invoiced yet)</span>'}</div>
        ${a.baseUnverified ? `<div class="small" style="margin:4px 0;color:var(--warn)">The base (gross or net) is not verified for this contract, so net is assumed.</div>`:''}
        ${!a.own ? `<div class="small muted" style="margin:4px 0">Public sales base ${fmt2(a.publicBase)} = invoiced ${fmt2(a.revenue)} ÷ (1 − ${a.fp}%). Commission withheld ${fmt2(a.retained)}, shown for information, not counted as a cost.</div>`:''}
        <div class="small muted" style="margin:4px 0">Effective fee on public sales: <b>${pct(a.effective)}</b>${a.model!=='fixed' && (a.fp||a.dp) ? ` · each extra euro of food sold gives ${a.fp}% to the festival` : ' · fixed fee: extra sales do not increase it'}</div>
        ${Number(e.price_cap||0)>0 ? `<div class="small muted" style="margin:4px 0">Contract price cap: ${fmt2(e.price_cap)} per full meal.</div>`:''}`;
    }
  }
  return `<div style="margin:6px 0">Festival fee: ${invoicedLine}</div>${rule}`;
}

/* ---------------- REPORTS ---------------- */
let reportState = { tab:'spend', filterEvent:'', filterVendor:'', filterCategory:'', filterQuarter:'', filterPaid:'', filterBuyer:'', ivaBuyer:'',
                    ivaPeriod:'month', ivaYear:String(new Date().getFullYear()), ivaDrill:null, ivaSalesDrill:null };

function reportRows(){
  return DATA.receiptLines.map(l=>{
    const r = DATA.receipts.find(x=>x.id===l.receipt_id);
    if(!r || autoKind(r)==='staff') return null;
    const e = DATA.events.find(x=>x.id===r.event_id);
    return {
      receiptId: r.id,
      season: (r.is_shared || !e) ? (r.season||'') : (e.season||r.season||''),
      eventId: r.is_shared ? '__shared__' : r.event_id, eventName: eventLabel(r),
      vendorId: r.vendor_id, vendorName: vendorName(r.vendor_id),
      expense_date: r.expense_date, quarter: quarterOf(r.expense_date), paid_by: r.paid_by || '', buyer_nif: r.buyer_nif || '',
      category: l.category,
      amount: Number(l.amount||0),
      amount_gross: Number(l.amount_gross ?? l.amount ?? 0),
      iva_rate: l.iva_rate, iva_amount: Number(l.iva_amount||0), iva_deductible: !!l.iva_deductible,
    };
  }).filter(Boolean);
}

function applyReportFilters(rows){
  const s = reportState;
  return rows.filter(r =>
    inSeason(r.season) &&
    (!s.filterEvent || r.eventId === s.filterEvent) &&
    (!s.filterVendor || r.vendorId === s.filterVendor) &&
    (!s.filterCategory || r.category === s.filterCategory) &&
    (!s.filterQuarter || r.quarter === s.filterQuarter) &&
    (!s.filterPaid || (s.filterPaid==='none' ? !r.paid_by : r.paid_by === s.filterPaid)) &&
    (!s.filterBuyer || (s.filterBuyer==='none' ? !r.buyer_nif : r.buyer_nif === s.filterBuyer))
  );
}
function receiptsFromRows(rows){
  const ids = new Set(rows.map(r=>r.receiptId));
  return DATA.receipts.filter(r=>ids.has(r.id))
    .sort((a,b)=> (b.expense_date||'').localeCompare(a.expense_date||'') || (b.created_at||'').localeCompare(a.created_at||''));
}
function quarterSortVal(q){ const m=/^Q(\d) (\d{4})$/.exec(q); return m ? Number(m[2])*10+Number(m[1]) : 0; }
function updateReportFilter(key, value){ reportState[key] = value; renderReports(); }
function setReportTab(t){ reportState.tab = t; renderReports(); }

function reportFiltersHtml(){

  const seasonRows = reportRows().filter(x=>inSeason(x.season));
  const quarters = [...new Set(seasonRows.map(x=>x.quarter).filter(q=>q!=='—'))].sort((a,b)=>quarterSortVal(b)-quarterSortVal(a));
  return `<div class="panel"><div class="toolbar">
    <div><label>Festival</label><select onchange="updateReportFilter('filterEvent', this.value)">
      <option value="">All</option>
      <option value="__shared__" ${s.filterEvent==='__shared__'?'selected':''}>Shared / all festivals</option>

    <div><label>Buyer NIF</label><select onchange="updateReportFilter('filterBuyer', this.value)">
      <option value="">All</option>
      ${Object.entries(BUYER_NIFS).map(([k,v])=>`<option value="${k}" ${s.filterBuyer===k?'selected':''}>${v} · ${k}</option>`).join('')}
      <option value="none" ${s.filterBuyer==='none'?'selected':''}>Not set</option></select></div>
    <div><label>Category</label><select onchange="updateReportFilter('filterCategory', this.value)">
      <option value="">All</option>${ALL_CATS.map(c=>`<option ${s.filterCategory===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div><label>Supplier</label><select onchange="updateReportFilter('filterVendor', this.value)">
      <option value="">All</option>

}

function renderReports(){
  const el = document.getElementById('page-reports');
  const t = reportState.tab;
  const tabs = `<div class="toolbar" style="margin:10px 0">
    <button class="${t==='spend'?'primary':''}" onclick="setReportTab('spend')">Spend</button>

    </div>
    <div class="panel">
      <h3 style="margin-top:0">Cost by category, per festival</h3>
      <div class="small muted" style="margin-bottom:8px">Cost = net of deductible IVA.</div>
      <div class="tblwrap"><table><thead><tr><th>Festival</th>${ALL_CATS.map(c=>`<th>${c}</th>`).join('')}<th>Total</th></tr></thead>

      }).join('') || `<tr><td colspan="${ALL_CATS.length+2}" class="muted">No spend in this selection.</td></tr>`}</tbody></table></div>

/* ---- IVA tab: company-wide, independent of the festival/vendor/category filters ---- */
const MONTH_LABELS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const IVA_RATES = [6,13,23];
function ivaCompute(){
  const s = reportState;
  const periods = s.ivaPeriod==='month' ? MONTH_LABELS : ['Q1','Q2','Q3','Q4'];
  const cells = periods.map(()=>({}));            // cells[i][rateKey] = { base, iva, items:[{r,l}] }
  const years = new Set([String(new Date().getFullYear())]);
  let undated = 0;
  DATA.receiptLines.forEach(l=>{
    if(!l.iva_deductible || !(Number(l.iva_rate)>0)) return;
    const r = DATA.receipts.find(x=>x.id===l.receipt_id);
    if(!r) return;
    if(s.ivaBuyer && (s.ivaBuyer==='none' ? r.buyer_nif : r.buyer_nif!==s.ivaBuyer)) return;
    if(!r.expense_date){ undated++; return; }
    years.add(r.expense_date.slice(0,4));
    if(r.expense_date.slice(0,4)!==s.ivaYear) return;
    const m = Number(r.expense_date.slice(5,7));
    const idx = s.ivaPeriod==='month' ? m-1 : Math.floor((m-1)/3);
    const key = IVA_RATES.includes(Number(l.iva_rate)) ? Number(l.iva_rate) : 'other';
    const c = cells[idx][key] = cells[idx][key] || { base:0, iva:0, items:[] };
    const iva = Number(l.iva_amount||0);
    c.iva += iva;
    c.base += Number(l.amount_gross ?? l.amount ?? 0) - iva;
    c.items.push({ r, l });
  });
  return { periods, cells, years:[...years].sort().reverse(), undated };
}
/* ---- IVA on sales (output). Lines with a gross and net amount give the real IVA (gross − net); events with only manual totals use 13% on the net ---- */
const MANUAL_SALES_RATE = 13;
/* Which NIF issues each festival's sales: Rodrigo for Primavera, Paredes de Coura and Somnii; Zac for the rest (Waking Life, Vilar de Mouro) */
function salesNifFor(ev){
  return /primave|paredes|somni/i.test(ev.name||'') ? '316800678' : '294747150';
}
function ivaSalesCompute(){
  const s = reportState;
  const periods = s.ivaPeriod==='month' ? MONTH_LABELS : ['Q1','Q2','Q3','Q4'];
  const cells = periods.map(()=>({}));          // cells[i][rateKey] = { base, iva, ev:{eventId:{base,iva,manual}} }
  const years = new Set();
  const flags = [];                             // manual-total events whose gross/net does not match 13%
  let undated = 0, noGross = 0;
  const add = (date, key, base, iva, ev, manual)=>{
    if(!date){ undated++; return; }
    years.add(date.slice(0,4));
    if(date.slice(0,4)!==s.ivaYear) return;
    const m = Number(date.slice(5,7));
    const idx = s.ivaPeriod==='month' ? m-1 : Math.floor((m-1)/3);
    const c = cells[idx][key] = cells[idx][key] || { base:0, iva:0, ev:{} };
    c.base += base; c.iva += iva;
    const e = c.ev[ev.id] = c.ev[ev.id] || { ev, base:0, iva:0, manual };
    e.base += base; e.iva += iva;
  };
  DATA.events.forEach(ev=>{
    if(s.ivaBuyer && (s.ivaBuyer==='none' || salesNifFor(ev)!==s.ivaBuyer)) return;
    const lines = salesLinesForEvent(ev.id);
    if(lines.length){
      lines.forEach(l=>{
        const net = Number(l.amount_net||0);
        if(!net && !Number(l.amount_gross||0)) return;
        if(l.amount_gross==null){ noGross++; return; }
        const gross = Number(l.amount_gross);
        const iva = gross - net;
        const ratio = net ? iva/net : 0;
        const hit = IVA_RATES.find(r=>Math.abs(ratio - r/100) < 0.012);
        const date = (l.occurred_at||'').slice(0,10) || ev.end_date || ev.start_date;
        add(date, hit || 'other', net, iva, ev, false);
      });
    } else if(Number(ev.sales_net_manual||0)){
      const net = Number(ev.sales_net_manual);
      let iva = net * MANUAL_SALES_RATE/100, key = MANUAL_SALES_RATE;
      if(ev.sales_gross_manual!=null){
        /* real IVA of the event (gross − net); a standard rate only if it matches almost exactly, otherwise it is a mix and goes to "Other rates" */
        iva = Number(ev.sales_gross_manual) - net;
        const ratio = net ? iva/net : 0;
        key = IVA_RATES.find(r=>Math.abs(ratio - r/100) < 0.005) || 'other'; /* manual totals can carry small rounding or blended-rate differences */
        if(key==='other') flags.push({ ev, iva, ratio });
        else if(Math.abs(iva - net*key/100) > 1) flags.push({ ev, iva, ratio, near:key, exact:net*key/100 });
      }
      add(ev.end_date || ev.start_date, key, net, iva, ev, true);
    }
  });
  return { periods, cells, years:[...years], flags, undated, noGross };
}
function ivaSalesDrillTo(i, key){
  const d = reportState.ivaSalesDrill;
  reportState.ivaSalesDrill = (d && String(d.i)===String(i) && String(d.key)===String(key)) ? null : { i, key };
  renderReports();
}
function ivaDrillTo(i, key){
  const d = reportState.ivaDrill;
  reportState.ivaDrill = (d && String(d.i)===String(i) && String(d.key)===String(key)) ? null : { i, key };
  renderReports();
}

function exportReportExcel(){
  const rows = applyReportFilters(reportRows());
  const receipts = receiptsFromRows(rows);
  const data = receipts.map(r=>{
    const s = receiptSummary(r);
    const ev = DATA.events.find(x=>x.id===r.event_id);
    const auto = autoKind(r);
    const o = {
      Festival: eventLabel(r), Date: r.expense_date||'', Quarter: quarterOf(r.expense_date),
      Supplier: auto ? 'Auto · '+auto : vendorName(r.vendor_id), 'Internal ID': r.invoice_number||'',
      'Paid by': r.paid_by ? PAID_BY[r.paid_by] : '', 'Buyer NIF': r.buyer_nif||'', Buyer: r.buyer_nif ? (BUYER_NIFS[r.buyer_nif]||'') : '', Category: s.cats.join(', '),
      Gross: s.gross, Net: s.net, IVA: s.iva, Deductible: s.deductible, Note: auto ? '' : (r.note||''), 'Invoice link': r.receipt_url||'',
    };
    IVA_RATES.forEach(rt=>{
      const ls = s.lines.filter(l=>Number(l.iva_rate)===rt);
      o['Base '+rt+'%'] = ls.reduce((t,l)=>t+Number(l.amount_gross ?? l.amount ?? 0)-Number(l.iva_amount||0),0);
      o['IVA '+rt+'%'] = ls.reduce((t,l)=>t+Number(l.iva_amount||0),0);
    });
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Invoices');
  XLSX.writeFile(wb, `moche-verde-invoices-${new Date().toISOString().slice(0,10)}.xlsx`);
}

function vendorTotals(vendorId){
  const receipts = DATA.receipts.filter(r=>r.vendor_id===vendorId);
  const totalSpend = receipts.reduce((s,r)=>s+Number(r.amount_gross||0),0);
  const items = DATA.purchaseItems.filter(p=>p.vendor_id===vendorId);
  return { receiptCount: receipts.length, totalSpend, itemCount: items.length };
}

function setVendorChartIngredient(ingredientId){

  renderVendorDetail();

function priceTrendChart(vendorId, ingredientId){
  if(!ingredientId) return '<div class="small muted">No ingredient purchases on file for this supplier yet.</div>';
  const points = DATA.purchaseItems
    .filter(p=>p.vendor_id===vendorId && p.ingredient_id===ingredientId && p.unit_price!=null && p.purchase_date)
    .sort((a,b)=>a.purchase_date<b.purchase_date?-1:1);
  if(!points.length) return '<div class="small muted">No dated price points for this ingredient yet.</div>';
  const W=640,H=200,padL=50,padR=16,padT=16,padB=28;
  const prices = points.map(p=>Number(p.unit_price));
  const minP = Math.min(...prices), maxP = Math.max(...prices);
  const lo = minP===maxP ? minP-1 : minP, hi = minP===maxP ? maxP+1 : maxP;
  const x = i => padL + (points.length>1 ? i/(points.length-1) : 0.5) * (W-padL-padR);
  const y = v => padT + (1 - (v-lo)/(hi-lo)) * (H-padT-padB);
  const path = points.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(Number(p.unit_price)).toFixed(1)}`).join(' ');
  const ticksY = [lo, (lo+hi)/2, hi];
  const gridLines = ticksY.map(v=>`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${padL-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text>`).join('');
  const labelEvery = Math.max(1, Math.ceil(points.length/6));
  const xLabels = points.map((p,i)=> i%labelEvery===0 || i===points.length-1
    ? `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${(p.purchase_date||'').slice(5)}</text>` : '').join('');
  const dots = points.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(Number(p.unit_price)).toFixed(1)}" r="4" fill="var(--brand)"><title>${p.purchase_date}: ${fmt(p.unit_price)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:640px">
    ${gridLines}${xLabels}
    <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

/* ---------------- INGREDIENTS (price comparison matrix) ----------------
   Rows = ingredients, one base unit each (kg, L or unit). Columns = vendors. Each cell = latest price per base unit WITHOUT IVA.
   Prices are rows in purchase_items (unit_price_net): typed here by hand now, filled by the Discord bot later. History is kept; the latest date wins. */
const ING_UNITS = [['kg','kg'],['L','L'],['unit','unit']];
let ingCols = null;   // vendor ids shown as columns (remembered per browser)
function ingColsLoad(){ try{ const v = JSON.parse(localStorage.getItem('mvIngCols')||'null'); if(Array.isArray(v)) return v; }catch(_){} return null; }
function ingColsSave(){ try{ localStorage.setItem('mvIngCols', JSON.stringify(ingCols)); }catch(_){} }
function ingPriceRows(){ return DATA.purchaseItems.filter(p=>p.ingredient_id && p.vendor_id && p.unit_price_net!=null && p.unit_price_net!==''); }
function ingKey(p){ return (p.purchase_date||'') + '|' + (p.created_at||''); }
function ingLatest(){
  const m = {};
  ingPriceRows().forEach(p=>{
    m[p.ingredient_id] = m[p.ingredient_id] || {};
    const cur = m[p.ingredient_id][p.vendor_id];
    if(!cur || ingKey(p) > ingKey(cur)) m[p.ingredient_id][p.vendor_id] = p;
  });
  return m;
}
function renderIngredients(){
  const el = document.getElementById('page-ingredients');
  ingAutoApply().then(n=>{ if(n) renderIngredients(); });
  const latest = ingLatest();
  if(!ingCols) ingCols = ingColsLoad() || [];
  const withPrices = [...new Set(ingPriceRows().map(p=>p.vendor_id))];
  let cols = ingCols.filter(id=>DATA.vendors.some(v=>v.id===id));
  withPrices.forEach(id=>{ if(!cols.includes(id) && DATA.vendors.some(v=>v.id===id)) cols.push(id); });
  const vendorsShown = cols.map(id=>DATA.vendors.find(v=>v.id===id));
  const hiddenVendors = DATA.vendors.filter(v=>!cols.includes(v.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const ings = [...DATA.ingredients].sort((a,b)=>a.name.localeCompare(b.name));
  const rows = ings.map(i=>{
    const prices = vendorsShown.map(v=>latest[i.id] && latest[i.id][v.id]);
    const known = prices.filter(Boolean).map(p=>Number(p.unit_price_net));
    const min = known.length ? Math.min(...known) : null, max = known.length ? Math.max(...known) : null;
    return `<tr><td class="clickable" onclick="openIngredientModal('${i.id}')"><b>${esc(i.name)}</b></td><td class="small muted">per ${esc(i.unit)}</td>
      ${vendorsShown.map((v,k)=>{
        const p = prices[k];
        if(!p) return `<td class="clickable muted" onclick="openIngPriceModal('${i.id}','${v.id}')" title="Add a price">+</td>`;
        const val = Number(p.unit_price_net);
        const cls = known.length>1 && val===min && min!==max ? 'good' : (known.length>1 && val===max && min!==max ? 'bad' : '');
        const txt = fmt2(val);
        return `<td class="clickable" onclick="openIngPriceModal('${i.id}','${v.id}')" title="${esc(p.purchase_date||'')}">${cls?`<span class="pill ${cls}">${txt}</span>`:txt}<div class="small muted" style="font-size:10px">${esc((p.purchase_date||'').slice(0,7))}</div></td>`;
      }).join('')}</tr>`;
  }).join('');
  el.innerHTML = `
    <h2>Ingredients</h2>
    ${ingQueueHtml()}
    <div class="toolbar"><button class="primary" onclick="openIngredientModal()">+ New ingredient</button>
      ${hiddenVendors.length ? `<select id="ing_addcol" onchange="ingAddCol(this.value)"><option value="">+ Add supplier column…</option>${hiddenVendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select>` : ''}</div>
    <div class="panel">
      <div class="small muted" style="margin-bottom:8px">Price per base unit, without IVA. Click a cell to add or correct a price. Green = cheapest, red = most expensive for the same ingredient. Prices read from invoices will show up here too.</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Ingredient</th><th>Unit</th>${vendorsShown.map(v=>`<th>${esc(v.name)}${withPrices.includes(v.id)?'':` <button onclick="ingHideCol('${v.id}')" title="Hide column">×</button>`}</th>`).join('')}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${2+vendorsShown.length}" class="muted">No ingredients yet. Add the first one, then pick supplier columns.</td></tr>`}</tbody></table></div>
    </div>`;
  ingQInit();
}

/* ---- Matching queue: invoice lines not yet tied to an ingredient ----
   An "alias" remembers that, for one vendor, an invoice text means one ingredient (or is not an ingredient at all). */
const BASE_TO_ING = { kg:'kg', l:'L', un:'unit' };
let ingQGroups = [];
function aliasKey(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
}
function ingTokens(s){
  const stop = new Set(['de','da','do','com','sem','rch','mchef','mtchef','unid','kgs','granel','ref','cart','pequena','grande','natural','fresco','frescos']);
  return aliasKey(s).split(' ').filter(w=>w.length>=3 && !/\d/.test(w) && !stop.has(w));
}
function ingSuggest(text){
  const t = new Set(ingTokens(text));
  let best = null, bestScore = 0;
  DATA.ingredients.forEach(i=>{
    const toks = ingTokens(i.name); if(!toks.length) return;
    const hit = toks.filter(w=>t.has(w)).length;
    if(!hit) return;
    const score = hit/toks.length + hit*0.01;
    if(score > bestScore){ best = i; bestScore = score; }
  });
  return best;
}
/* net price per the ingredient's base unit for one invoice line; null when it cannot be worked out */
function ingNetFor(p, ing, factor){
  const fam = BASE_TO_ING[p.base_unit];
  const stored = (p.unit_price_net!=null && p.unit_price_net!=='') ? Number(p.unit_price_net) : null;
  if(stored!=null && fam===ing.unit) return stored;
  const f = Number(factor);
  if(f>0 && p.unit_price!=null && p.unit_price!=='') return Number(p.unit_price)/f;
  return null;
}
function ingAliasOf(vendorId, key){ return DATA.ingredientAliases.find(a=>a.vendor_id===vendorId && a.alias_key===key); }
function ingQueueGroups(){
  const g = new Map();
  DATA.purchaseItems.forEach(p=>{
    if(p.ingredient_id || !p.vendor_id || !p.item_name) return;
    const k = aliasKey(p.item_name); if(!k) return;
    const a = ingAliasOf(p.vendor_id, k);
    if(a && a.ignored) return;
    const id = p.vendor_id+'|'+k;
    let e = g.get(id);
    if(!e){ e = { id, vendor_id:p.vendor_id, key:k, text:p.item_name, items:[], alias:a||null }; g.set(id, e); }
    e.items.push(p);
  });
  return [...g.values()].map(e=>{ e.items.sort((a,b)=>ingKey(b).localeCompare(ingKey(a))); e.latest = e.items[0]; return e; })
    .sort((a,b)=> vendorName(a.vendor_id).localeCompare(vendorName(b.vendor_id)) || a.text.localeCompare(b.text));
}
/* lines whose text already has an alias (e.g. from a new invoice) are tied to the ingredient on their own */
let ingApplying = false;
async function ingAutoApply(){
  if(ingApplying) return 0;
  ingApplying = true;
  try{
    const todo = [];
    DATA.purchaseItems.forEach(p=>{
      if(p.ingredient_id || !p.vendor_id || !p.item_name) return;
      const a = ingAliasOf(p.vendor_id, aliasKey(p.item_name));
      if(!a || a.ignored || !a.ingredient_id) return;
      const ing = DATA.ingredients.find(i=>i.id===a.ingredient_id); if(!ing) return;
      const price = ingNetFor(p, ing, a.base_per_unit);
      if(price==null) return;
      todo.push(sb.from('purchase_items').update({ ingredient_id:ing.id, unit_price_net:Math.round(price*10000)/10000 }).eq('id', p.id));
    });
    if(!todo.length) return 0;
    await Promise.all(todo);
    await loadAll();
    toast(`${todo.length} new invoice line${todo.length===1?'':'s'} matched to known ingredients.`);
    return todo.length;
  } catch(e){ console.error(e); return 0; }
  finally { ingApplying = false; }
}
function ingQueueHtml(){
  ingQGroups = ingQueueGroups();
  const ignored = DATA.ingredientAliases.filter(a=>a.ignored);
  const ings = [...DATA.ingredients].sort((a,b)=>a.name.localeCompare(b.name));
  if(!ingQGroups.length && !ignored.length) return '';
  const rows = ingQGroups.map((g,i)=>{
    const sug = g.alias && g.alias.ingredient_id ? DATA.ingredients.find(x=>x.id===g.alias.ingredient_id) : ingSuggest(g.text);
    const l = g.latest;
    const per = (l.unit_price_net!=null && l.unit_price_net!=='') ? `${fmt2(l.unit_price_net)} / ${esc(l.base_unit||'')}` : '<span class="muted">no per-unit price</span>';
    return `<tr class="ingq" data-q="${esc((vendorName(g.vendor_id)+' '+g.text).toLowerCase())}">
      <td class="small">${esc(vendorName(g.vendor_id))}</td>
      <td>${esc(g.text)}<div class="small muted">${g.items.length} line${g.items.length===1?'':'s'} · last ${esc((l.purchase_date||'').slice(0,10))} · ${esc(l.qty||'')} ${esc(l.unit||'')} · ${per}</div></td>
      <td><select id="q_ing_${i}" onchange="ingQChange(${i})">
          <option value="">Choose…</option>
          ${ings.map(x=>`<option value="${x.id}" ${sug&&sug.id===x.id?'selected':''}>${esc(x.name)} (${esc(x.unit)})</option>`).join('')}
          <option value="__new">+ New ingredient…</option>
          <option value="__ignore">Not an ingredient (ignore)</option>
        </select>
        <div id="q_new_${i}" style="display:none;margin-top:6px"><input id="q_name_${i}" placeholder="Ingredient name" value="${esc((ingTokens(g.text)[0]||'').replace(/^./,c=>c.toUpperCase()))}" style="width:140px">
          <select id="q_unit_${i}">${ING_UNITS.map(([k,v])=>`<option value="${k}" ${BASE_TO_ING[l.base_unit]===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div id="q_fac_${i}" style="display:none;margin-top:6px"><span class="small muted" id="q_faclab_${i}"></span> <input id="q_f_${i}" type="number" step="0.001" min="0" style="width:90px" value="${g.alias&&g.alias.base_per_unit?g.alias.base_per_unit:''}"></div></td>
      <td><button class="primary" onclick="ingQSave(${i})">Match</button></td></tr>`;
  }).join('');
  return `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h3 style="margin:0">Items to match${ingQGroups.length?` (${ingQGroups.length})`:''}</h3>
        <input type="search" id="q_search" placeholder="Search supplier or item" oninput="ingQFilter(this.value)" style="max-width:240px">
      </div>
      <div class="small muted" style="margin:6px 0 10px">Texts read from invoices that are not yet tied to an ingredient. Choose the ingredient once for each supplier's text: every line with that text is matched at once, and new invoices are matched on their own from then on. Use "ignore" for things that are not ingredients.</div>
      ${ingQGroups.length ? `<div style="overflow-x:auto;max-height:420px;overflow-y:auto"><table data-nosort><thead><tr><th>Supplier</th><th>Invoice text</th><th>Ingredient</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="small muted">Everything is matched.</div>'}
      ${ignored.length ? `<details style="margin-top:10px"><summary class="small">Ignored texts (${ignored.length})</summary>
        <table data-nosort><tbody>${ignored.map(a=>`<tr><td class="small">${esc(vendorName(a.vendor_id))}</td><td>${esc(a.alias_text||a.alias_key)}</td><td><button onclick="ingAliasDelete('${a.id}')">Restore</button></td></tr>`).join('')}</tbody></table></details>` : ''}
    </div>`;
}
function ingQInit(){ ingQGroups.forEach((_,i)=>ingQChange(i)); }
function ingQFilter(q){
  const t = String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  document.querySelectorAll('tr.ingq').forEach(tr=>{ tr.style.display = t.every(w=>tr.dataset.q.includes(w)) ? '' : 'none'; });
}
/* show the "new ingredient" fields, and the conversion field when the line is not in the ingredient's unit */
function ingQChange(i){
  const g = ingQGroups[i]; const sel = document.getElementById('q_ing_'+i); if(!g || !sel) return;
  const v = sel.value;
  document.getElementById('q_new_'+i).style.display = v==='__new' ? '' : 'none';
  let unit = null;
  if(v==='__new') unit = document.getElementById('q_unit_'+i).value;
  else if(v && v!=='__ignore'){ const ing = DATA.ingredients.find(x=>x.id===v); unit = ing && ing.unit; }
  let need = false;
  if(unit){
    need = g.items.some(p=>ingNetFor(p, { unit }, null)==null);
  }
  const fac = document.getElementById('q_fac_'+i);
  fac.style.display = need ? '' : 'none';
  if(need){
    const sale = g.latest.unit && g.latest.unit!=='un' ? g.latest.unit : 'unit';
    document.getElementById('q_faclab_'+i).textContent = `How many ${unit} in one ${sale}?`;
  }
}
async function ingQSave(i){
  const g = ingQGroups[i]; if(!g) return;
  const v = document.getElementById('q_ing_'+i).value;
  if(!v){ toast('Choose an ingredient first.'); return; }
  const key = { vendor_id:g.vendor_id, alias_key:g.key, alias_text:g.text };
  if(v==='__ignore'){
    const r = await sb.from('ingredient_aliases').upsert({ ...key, ingredient_id:null, ignored:true, base_per_unit:null }, { onConflict:'vendor_id,alias_key' });
    if(r.error){ toast(r.error.message+' (did you run the aliases SQL?)'); return; }
    await loadAll(); renderIngredients(); return;
  }
  let ing;
  if(v==='__new'){
    const name = document.getElementById('q_name_'+i).value.trim();
    if(!name){ toast('Give the new ingredient a name.'); return; }
    ing = DATA.ingredients.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!ing){
      const r = await sb.from('ingredients').insert({ name, unit:document.getElementById('q_unit_'+i).value, price_per_unit:0 }).select();
      if(r.error){ toast(r.error.message); return; }
      ing = r.data[0];
    }
  } else ing = DATA.ingredients.find(x=>x.id===v);
  if(!ing) return;
  const facEl = document.getElementById('q_f_'+i);
  const factor = facEl && facEl.offsetParent!==null && facEl.value!=='' ? Number(facEl.value) : null;
  const prices = g.items.map(p=>ingNetFor(p, ing, factor));
  if(prices.some(x=>x==null)){ toast(`Some lines have no price per ${ing.unit}. Fill in how many ${ing.unit} are in one unit of sale.`); ingQChange(i); return; }
  const a = await sb.from('ingredient_aliases').upsert({ ...key, ingredient_id:ing.id, ignored:false, base_per_unit:factor }, { onConflict:'vendor_id,alias_key' });
  if(a.error){ toast(a.error.message+' (did you run the aliases SQL?)'); return; }
  await Promise.all(g.items.map((p,k)=>sb.from('purchase_items').update({ ingredient_id:ing.id, unit_price_net:Math.round(prices[k]*10000)/10000 }).eq('id', p.id)));
  toast(`${g.items.length} line${g.items.length===1?'':'s'} matched to ${ing.name}.`);
  await loadAll(); renderIngredients();
}
async function ingAliasDelete(id){
  const r = await sb.from('ingredient_aliases').delete().eq('id', id);
  if(r.error){ toast(r.error.message); return; }
  await loadAll(); renderIngredients();
}
function ingAliasListHtml(ingId){
  const list = DATA.ingredientAliases.filter(a=>a.ingredient_id===ingId);
  if(!list.length) return '';
  return `<h4 style="margin:16px 0 4px">Invoice texts matched to this ingredient</h4>
    <table data-nosort><tbody>${list.map(a=>`<tr><td class="small">${esc(vendorName(a.vendor_id))}</td><td>${esc(a.alias_text||a.alias_key)}</td>
      <td><button onclick="ingUnmatch('${a.id}')">Unmatch</button></td></tr>`).join('')}</tbody></table>`;
}
async function ingUnmatch(aliasId){
  const a = DATA.ingredientAliases.find(x=>x.id===aliasId); if(!a) return;
  const ids = DATA.purchaseItems.filter(p=>p.ingredient_id===a.ingredient_id && p.vendor_id===a.vendor_id && (p.receipt_id||p.source_key) && aliasKey(p.item_name)===a.alias_key).map(p=>p.id);
  const d = await sb.from('ingredient_aliases').delete().eq('id', aliasId);
  if(d.error){ toast(d.error.message); return; }
  if(ids.length) await sb.from('purchase_items').update({ ingredient_id:null }).in('id', ids);
  closeModal(); await loadAll(); renderIngredients();
}

/* ---------------- MODAL ---------------- */
function openModal(){ document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
</script>
<script>
/* ---- Click-to-sort tables + numeric alignment ---- */
(function(){
  const state = {};   // key -> {label, dir}
  function tkey(t){
    const host = t.closest('.page') || t.closest('[class*=modal]') || document.body;
    const id = host.id || host.className || 'x';
    const all = [...host.querySelectorAll('table')];
    return id + '#' + all.indexOf(t);
  }
  const NUM = /^[-+]?\d+(\.\d+)?$/;
  function parse(txt){
    let t = (txt||'').replace(/\s+/g,' ').trim();
    if(t===''||t==='—'||t==='-'||t==='–') return {v:null};
    let m;
    if(/^\d{4}-\d{2}-\d{2}/.test(t)){ const d=Date.parse(t.slice(0,10)); if(!isNaN(d)) return {v:d,k:'date'}; }
    if((m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))){ const y=m[3].length===2?2000+ +m[3]:+m[3]; return {v:Date.UTC(y,m[2]-1,m[1]),k:'date'}; }
    if(/^\d{1,2} [A-Za-z]{3,9},? \d{4}/.test(t)){ const d=Date.parse(t.replace(',','')+' UTC'); if(!isNaN(d)) return {v:d,k:'date'}; }
    const n = t.replace(/[€%\s]/g,'').replace(/,/g,'').replace(/−/g,'-');
    if(NUM.test(n)) return {v:parseFloat(n),k:'num'};
    return {v:t.toLowerCase(),k:'text'};
  }
  function info(t){
    if(t.hasAttribute('data-nosort')) return null;
    const thead=t.tHead; if(!thead||!thead.rows.length) return null;
    const ths=[...thead.rows[thead.rows.length-1].cells]; if(!ths.length) return null;
    if(t.querySelector('tbody input, tbody select, tbody textarea')) return null;
    const body=t.tBodies[0]; if(!body) return null;
    const rows=[], fixed=[];
    for(const r of body.rows){
      if(r.classList.contains('totalrow')){ fixed.push(r); continue; }
      if([...r.cells].some(c=>c.colSpan>1)) return null;
      if(r.cells.length!==ths.length) return null;
      rows.push(r);
    }
    if(rows.length<2) return null;
    return {ths,body,rows,fixed};
  }
  function cellVal(r,i){ const c=r.cells[i]; return parse(c.dataset.sort!==undefined?c.dataset.sort:c.textContent); }
  function colKind(rows,i){
    const ks=new Set(); rows.forEach(r=>{const p=cellVal(r,i); if(p.v!==null) ks.add(p.k);});
    if(ks.size===1) return [...ks][0];
    return ks.size===0?'empty':'text';
  }
  function apply(t,inf,key){
    const {ths,body,rows,fixed}=inf;
    ths.forEach((th,i)=>{
      const kind=colKind(rows,i);
      th.dataset.kind=kind;
      th.classList.add('sortable'); th.tabIndex=0;
      if(kind==='num'){ th.classList.add('num'); rows.concat(fixed).forEach(r=>r.cells[i]&&r.cells[i].classList.add('num')); }
      th.removeAttribute('data-dir');
    });
    const st=state[key]; if(!st) return;
    const i=ths.findIndex(th=>th.textContent.trim()===st.label); if(i<0) return;
    const kind=ths[i].dataset.kind, dir=st.dir==='asc'?1:-1;
    const keyed=rows.map((r,idx)=>({r,idx,p:cellVal(r,i)}));
    keyed.sort((a,b)=>{
      if(a.p.v===null&&b.p.v===null) return a.idx-b.idx;
      if(a.p.v===null) return 1; if(b.p.v===null) return -1;
      let c;
      if(kind==='text'){ c=String(a.p.v).localeCompare(String(b.p.v),undefined,{numeric:true,sensitivity:'base'}); }
      else c=a.p.v-b.p.v;
      return c===0?a.idx-b.idx:c*dir;
    });
    keyed.forEach(o=>body.appendChild(o.r));
    fixed.forEach(r=>body.appendChild(r));
    ths[i].dataset.dir=st.dir;
  }
  let busy=false, queued=false;
  function run(){
    queued=false; busy=true;
    document.querySelectorAll('table').forEach(t=>{
      const inf=info(t); if(!inf) return;
      const key=tkey(t);
      if(inf.ths[0].classList.contains('sortable') && t.dataset.sortSig===String(inf.rows.length)+'|'+(state[key]?state[key].label+state[key].dir:'')+'|'+(t.dataset.sortDone||'')) return;
      apply(t,inf,key);
      t.dataset.sortDone='1';
      t.dataset.sortSig=String(inf.rows.length)+'|'+(state[key]?state[key].label+state[key].dir:'')+'|1';
    });
    busy=false;
  }
  function schedule(){ if(busy||queued) return; queued=true; requestAnimationFrame(run); }
  new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
  schedule();
  function toggle(th){
    const t=th.closest('table'); const inf=info(t); if(!inf) return;
    const key=tkey(t), label=th.textContent.trim(), kind=th.dataset.kind;
    const cur=state[key];
    let dir;
    if(cur&&cur.label===label) dir=cur.dir==='asc'?'desc':'asc';
    else dir=(kind==='text')?'asc':'desc';
    state[key]={label,dir};
    t.dataset.sortSig='';
    busy=true; apply(t,inf,key); busy=false;
    t.dataset.sortSig=String(inf.rows.length)+'|'+label+dir+'|1';
  }
  document.addEventListener('click',e=>{
    const th=e.target.closest&&e.target.closest('th.sortable'); if(!th) return;
    if(e.target.closest('button,input,select,a')) return;
    toggle(th);
  });
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const th=e.target.closest&&e.target.closest('th.sortable'); if(th) toggle(th);
  });
})();
</script>
<script>
/* ---- Toasts and in-app confirm dialog ---- */
function toast(msg){
  msg = String(msg==null?'':msg);
  let box = document.getElementById('toasts');
  if(!box){ box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const el = document.createElement('div');
  el.className = 'toast' + (/could not|error|fail|already|invalid|enter |choose|select|required|only pdf|larger|need to|give the|cancel/i.test(msg) ? ' bad' : '');
  el.textContent = msg;
  const kill = ()=>{ if(el.parentNode) el.parentNode.removeChild(el); };
  el.onclick = kill;
  box.appendChild(el);
  setTimeout(kill, Math.min(14000, 4500 + msg.length*45));
}
function askConfirm(msg){
  return new Promise(resolve=>{
    const back = document.createElement('div'); back.id = 'askBack';
    const box = document.createElement('div'); box.id = 'askBox';
    const p = document.createElement('p'); p.textContent = msg;
    const row = document.createElement('div'); row.className = 'row';
    const no = document.createElement('button'); no.textContent = 'Cancel';
    const del = /^\s*delete/i.test(msg);
    const yes = document.createElement('button'); yes.textContent = del ? 'Delete' : 'Continue';
    yes.className = del ? 'danger' : 'primary';
    row.append(no, yes); box.append(p, row); back.appendChild(box); document.body.appendChild(back);
    const done = v=>{ document.removeEventListener('keydown', key, true); back.remove(); resolve(v); };
    const key = e=>{ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', key, true);
    no.onclick = ()=>done(false); yes.onclick = ()=>done(true);
    back.addEventListener('mousedown', e=>{ if(e.target===back) done(false); });
    no.focus();
  });
}
</script>
<script>
/* ---- Chart tooltip ---- */
(function(){
  let el = null;
  function get(){ if(!el){ el = document.createElement('div'); el.id = 'ctip'; document.body.appendChild(el); } return el; }
  document.addEventListener('mouseover', ev=>{
    const t = ev.target.closest && ev.target.closest('[data-tip]'); if(!t) return;
    const n = get(); n.textContent = t.getAttribute('data-tip'); n.style.display = 'block';
  });
  document.addEventListener('mousemove', ev=>{
    if(!el || el.style.display!=='block') return;
    const w = el.offsetWidth; let x = ev.clientX + 12; if(x + w > window.innerWidth - 8) x = ev.clientX - w - 12;
    el.style.left = x + 'px'; el.style.top = (ev.clientY + 14) + 'px';
  });
  document.addEventListener('mouseout', ev=>{
    if(el && ev.target.closest && ev.target.closest('[data-tip]')) el.style.display = 'none';
  });
})();
</script>
