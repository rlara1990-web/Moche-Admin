<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moche Verde Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f4f2; --surface:#fff; --surface-2:#fafbfa; --border:#dfe2df;
  --ink:#20231f; --ink-2:#575d58; --ink-3:#8a908a;
  --brand:#173d2a; --brand-soft:#edf4ef; --chart:#2f7a53; --chart-2:#b7c4bb;
  --good:#176b36; --good-soft:#e8f5ea;
  --warn:#8a6d00; --warn-soft:#fff4d7;
  --bad:#a33; --bad-soft:#fde9e7;
  --front:#2f5fa3; --front-soft:#e7eefa;
  --back:#c2560c; --back-soft:#fbe4d2;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{height:60px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
header h1{font-size:18px;margin:0;font-weight:700} header .sub{font-size:12px;color:#cfe0d6}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit}
.shell{display:grid;grid-template-columns:190px 1fr;height:calc(100vh - 60px);min-height:0}
nav{background:var(--surface);border-right:1px solid var(--border);padding:10px 8px 14px;overflow-y:auto}
.navgroup{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 4px}
.navgroup:first-child{padding-top:4px}
nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:7px;margin-bottom:2px;cursor:pointer;font:inherit;color:var(--ink)}
nav button.active,nav button:hover{background:var(--brand-soft);font-weight:600}
main{padding:22px;overflow:auto;min-height:0}
.page{max-width:1280px}
.panel .formgrid,.card .formgrid{max-width:880px}
.modal .formgrid{max-width:none}
.seg{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px;background:rgba(255,255,255,.14);border-radius:8px;padding:2px}
header .seg button{border:0;padding:3px 11px;border-radius:6px;font-size:13px;color:#fff;background:transparent}
header .seg button:hover{background:rgba(255,255,255,.18)}
header .seg button.on{background:#fff;color:var(--brand);font-weight:700}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--ink)}
th.sortable[data-dir=asc]::after{content:" \25B2";font-size:9px}
th.sortable[data-dir=desc]::after{content:" \25BC";font-size:9px}
th.num,td.num{text-align:right}
h2{margin:0 0 4px} h3{margin:18px 0 8px}
.muted{color:var(--ink-2)} .small{font-size:12px;color:var(--ink-3)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.card .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.card .num{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{padding:8px;border:1px solid #c5cac5;border-radius:6px;font:inherit;background:#fff;width:100%}
label{font-size:12px;font-weight:600;display:block;margin-bottom:4px;color:var(--ink-2)}
button{padding:8px 12px;border:1px solid #bec4bf;border-radius:6px;background:#fff;cursor:pointer;font:inherit}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.danger{color:var(--bad);border-color:#e6b9b3}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 7px;border-bottom:1px solid #eceeec;text-align:left;vertical-align:top;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3);background:var(--surface-2)}
tr.clickable:hover{background:var(--surface-2);cursor:pointer}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .full{grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;padding:24px;overflow:auto}
.modal.open{display:block}
.modalbox{max-width:640px;margin:20px auto;background:#fff;border-radius:10px;padding:18px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.exrow{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.tblwrap{overflow:auto;max-height:72vh}
th{position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 #eceeec}
.tblwrap th:first-child,.tblwrap td:first-child{position:sticky;left:0;background:var(--surface)}
.tblwrap th:first-child{z-index:3;background:var(--surface-2)}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 36px))}
.invsearch{margin:10px 0 8px}
.invsearch input{width:100%;max-width:420px}
.ftabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 14px;overflow-x:auto}
.ftabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;font-size:14px;color:var(--ink-3);white-space:nowrap}
.ftabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
table.cmp td.tot{font-weight:600;border-left:1px solid var(--border)}
.card .num.neg{color:var(--bad,#a11)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chips button{border-radius:999px;padding:5px 13px;font-size:13px}
.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.bi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;margin:0 0 16px}
.card .sub2{font-size:11px;color:var(--ink-3);margin-top:2px}
.bi-cards .card .sub2{font-size:11px;color:var(--ink-3);margin-top:2px}
.bi-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.bi-title h3{margin:0}
.bi-q{font-size:12px;color:var(--ink-3)}
.vbars{position:relative;display:flex;align-items:flex-end;gap:6px;height:170px;margin:14px 0 4px 38px;border-bottom:1px solid var(--border)}
.vbars .grid{position:absolute;left:-38px;right:0;border-top:1px dashed #e4e7e4;pointer-events:none}
.vbars .grid span{position:absolute;left:0;top:-8px;font-size:10px;color:var(--ink-3);width:34px;text-align:right}
.vbar{flex:1;min-width:6px;max-width:90px;background:var(--chart);border-radius:4px 4px 0 0;position:relative;cursor:default}
.vbar.x{background:repeating-linear-gradient(135deg,var(--chart-2) 0 4px,#e3e9e5 4px 8px)}
.vbar:hover{filter:brightness(1.12)}
.vlabels{display:flex;gap:6px;margin:4px 0 0 38px}
.vlabels div{flex:1;min-width:6px;max-width:90px;font-size:10px;color:var(--ink-3);text-align:center;white-space:nowrap;overflow:visible}
.daychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.daychips button{font-size:12px;padding:4px 10px;border-radius:999px}
.daychips button.x{background:var(--surface-2);color:var(--ink-3);border-style:dashed}
.heat{display:grid;gap:2px;margin-top:10px;overflow-x:auto}
.heat .hc{height:22px;border-radius:3px;background:#f0f3f1}
.heat .hl{font-size:11px;color:var(--ink-2);display:flex;align-items:center;white-space:nowrap;padding-right:8px}
.heat .hh{font-size:10px;color:var(--ink-3);text-align:center}
.hbar{display:grid;grid-template-columns:minmax(120px,200px) 1fr 150px;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.hbar .track{height:12px;background:#eef1ee;border-radius:0 6px 6px 0}
.hbar .fill{height:12px;background:var(--chart);border-radius:0 6px 6px 0}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar .v small{display:block;color:var(--ink-3);font-size:11px}
#ctip{position:fixed;z-index:80;background:#262b27;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;display:none;max-width:260px;line-height:1.4}
@media(max-width:800px){.hbar{grid-template-columns:100px 1fr 100px}}
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-top:16px}
.cmp-grid h4{margin:0 0 2px;font-size:14px}
.cmp-grid .bi-q{display:block;margin-bottom:8px}
.cb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 74px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.cb .tr{position:relative;height:14px;background:#f1f3f1;border-radius:3px}
.cb .bar{position:absolute;top:0;bottom:0;background:var(--chart);border-radius:3px}
.cb .bar.neg{background:var(--bad)}
.cb .mk{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.cb .zero{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink-3)}
.cb .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cb .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.cmp td:not(:first-child),table.cmp th:not(:first-child){text-align:right}
table.cmp th{white-space:normal}
table.cmp td:first-child{white-space:nowrap}
.toast{background:#262b27;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;border-left:4px solid #7fb48f}
.toast.bad{border-left-color:#e57368}
#askBack{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
#askBox{background:#fff;border-radius:10px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#askBox p{margin:0 0 16px;line-height:1.45;white-space:pre-wrap}
#askBox .row{display:flex;gap:8px;justify-content:flex-end}
.catchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.catchip{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px}
.catchip b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
tr.totalrow td{font-weight:700;border-top:2px solid var(--border);background:var(--surface-2)}
tr.autorow td{color:var(--ink-3)}
.lineitem{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#loginScreen .box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px;width:320px}
#loginScreen h1{font-size:20px;margin:0 0 4px;color:var(--brand)}
#loginScreen .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:16px}
@media(max-width:800px){.shell{grid-template-columns:minmax(0,1fr)}main{padding:12px;overflow-x:hidden}.page{min-width:0}.panel,.card{overflow-x:auto}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}nav button{width:auto;white-space:nowrap}.navgroup{display:none}.shell{grid-template-rows:auto 1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="box">
    <h1>Moche Verde</h1>
    <div class="muted small" style="margin-bottom:18px">Admin access</div>
    <label>Email</label>
    <input id="loginEmail" type="email" autocomplete="username" style="margin-bottom:10px">
    <label>Password</label>
    <input id="loginPass" type="password" autocomplete="current-password" style="margin-bottom:14px">
    <button class="primary" style="width:100%" onclick="doLogin()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <div><h1>Moche Verde Administration</h1><div class="sub">Season <span id="seasonSeg" class="seg"></span></div></div>
  <button onclick="doLogout()">Sign out</button>
</header>
<div class="shell">
<nav>
  <div class="navgroup">Overview</div>
  <button class="active" data-page="dashboard" onclick="showPage('dashboard')">Dashboard</button>
  <div class="navgroup">Operations</div>
  <button data-page="events" onclick="showPage('events')">Events</button>
  <button data-page="contracts" onclick="showPage('contracts')">Contracts</button>
  <button data-page="staff" onclick="showPage('staff')">Staff</button>
  <div class="navgroup">Money</div>
  <button data-page="finance" onclick="showPage('finance')">Finance</button>
  <button data-page="reports" onclick="showPage('reports')">Reports</button>
  <button data-page="vendors" onclick="showPage('vendors')">Suppliers</button>
  <div class="navgroup">Kitchen</div>
  <button data-page="ingredients" onclick="showPage('ingredients')">Ingredients</button>
</nav>
<main>
  <div id="page-dashboard" class="page"></div>
  <div id="page-events" class="page" style="display:none"></div>
  <div id="page-contracts" class="page" style="display:none"></div>
  <div id="page-finance" class="page" style="display:none"></div>
  <div id="page-reports" class="page" style="display:none"></div>
  <div id="page-staff" class="page" style="display:none"></div>
  <div id="page-staffdetail" class="page" style="display:none"></div>
  <div id="page-vendors" class="page" style="display:none"></div>
  <div id="page-vendordetail" class="page" style="display:none"></div>
  <div id="page-eventdetail" class="page" style="display:none"></div>
  <div id="page-ingredients" class="page" style="display:none"></div>
</main>
</div>
</div>

<div id="modal" class="modal"><div class="modalbox">
  <div class="modalhead"><h2 id="modalTitle" style="margin:0;font-size:17px"></h2><button onclick="closeModal()">Close</button></div>
  <div id="modalBody"></div>
</div></div>

<script>
/* ============================================================
   CONFIG — fill these in after creating your Supabase project
   (Project Settings → API). Anon key is safe to expose in
   client code; Row Level Security restricts it to signed-in
   users only, per schema.sql.
   ============================================================ */
const SUPABASE_URL = "https://alhhsxxbstpeyibmuqzx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GJi52Xp7hqR1xYopI_J8Dw_wMAv_3Jw";
let SEASON_ALL = false; // true = the selector is on "All seasons" (applies to every page)
let CURRENT_SEASON = "2027"; // the last real season picked; new records default to it
try{ const saved = localStorage.getItem('mvSeason'); if(saved) CURRENT_SEASON = saved; SEASON_ALL = localStorage.getItem('mvSeasonAll')==='1'; }catch(e){}
function inSeason(y){ return SEASON_ALL || y===CURRENT_SEASON; }
function seasonBadge(){ return `<span class="small muted" style="font-weight:normal">${SEASON_ALL?'All seasons':'Season '+CURRENT_SEASON}</span>`; }
function evName(e){ return SEASON_ALL ? `${esc(e.name)} <span class="small muted">${esc(e.season||'')}</span>` : esc(e.name); }
let currentPage = 'dashboard';
/* Buyer NIFs: the tax number each invoice was issued to (it decides which partner declares the IVA) */
const BUYER_NIFS = { '316800678':'Rodrigo', '294747150':'Zac' };
function buyerLabel(nif){ return nif ? (BUYER_NIFS[nif] ? BUYER_NIFS[nif]+' ('+nif+')' : nif) : '—'; }
/* URL of the deployed "ai-assist" Supabase Edge Function (see
   supabase/functions/ai-assist). Looks like:
   https://xxxxx.supabase.co/functions/v1/ai-assist */
const GEMINI_EDGE_FUNCTION_URL = "https://alhhsxxbstpeyibmuqzx.supabase.co/functions/v1/ai-assist";
/* Fixed-cost allocation view: a festival below this Operational
   Margin % is flagged red; below WARN_OPM it's flagged amber. */
const BAD_OPM = 0, WARN_OPM = 0.15;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let DATA = { events:[], vendors:[], receipts:[], receiptLines:[], purchaseItems:[], ingredientAliases:[], salesImportProfiles:[], salesImports:[], salesLines:[], fixedCosts:[], ingredients:[], rosterWorkers:[], staffShifts:[], eventContracts:[] };

/* ---------------- AUTH ---------------- */
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = error.message; return; }
  await boot();
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

async function boot(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  await loadAll();
  renderSeasonSelect();
  showPage('dashboard');
}
function seasonList(){
  return [...new Set([...DATA.events.map(e=>e.season), '2026', '2027', CURRENT_SEASON].filter(Boolean))].sort();
}
function renderSeasonSelect(){
  const el = document.getElementById('seasonSeg');
  if(!el) return;
  el.innerHTML = seasonList().map(y=>`<button class="${(!SEASON_ALL && y===CURRENT_SEASON)?'on':''}" onclick="setSeason('${y}')">${y}</button>`).join('')
    + `<button class="${SEASON_ALL?'on':''}" onclick="setSeason('all')">All</button>`;
}
function setSeason(y){
  if(y==='all'){ SEASON_ALL = true; }
  else { SEASON_ALL = false; CURRENT_SEASON = y; }
  try{ localStorage.setItem('mvSeasonAll', SEASON_ALL?'1':'0'); if(!SEASON_ALL) localStorage.setItem('mvSeason', y); }catch(e){}
  showPage(['dashboard','events','finance','staff','reports','contracts'].includes(currentPage) ? currentPage : 'dashboard');
}

(async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await boot();
})();

/* ---------------- DATA LOADING ---------------- */
/* The database returns at most 1,000 rows per request, so every table is read in pages */
async function fetchAll(table, orderCol, asc){
  const size = 1000; let from = 0, out = [];
  for(;;){
    let q = sb.from(table).select('*');
    if(orderCol) q = q.order(orderCol, { ascending: asc!==false });
    q = q.order('id');
    const { data, error } = await q.range(from, from+size-1);
    if(error){ console.error('Could not load '+table+': '+error.message); break; }
    out = out.concat(data||[]);
    if(!data || data.length < size) break;
    from += size;
  }
  return { data: out };
}
async function loadAll(){
  const [ev, vd, rc, rcl, pi, sip, si, sl, fc, ing, rw, ss, ctr, ia] = await Promise.all([
    fetchAll('events','start_date'),
    fetchAll('vendors','name'),
    fetchAll('receipts'),
    fetchAll('receipt_lines'),
    fetchAll('purchase_items','purchase_date',false),
    fetchAll('sales_import_profiles'),
    fetchAll('sales_imports','imported_at',false),
    fetchAll('sales_lines'),
    fetchAll('fixed_costs'),
    fetchAll('ingredients','name'),
    fetchAll('roster_workers'),
    fetchAll('staff_shifts'),
    fetchAll('event_contracts','created_at',false),
    fetchAll('ingredient_aliases'),
  ]);
  DATA.ingredientAliases = ia.data||[];
  DATA.events = ev.data||[]; DATA.vendors = vd.data||[]; DATA.receipts = rc.data||[]; DATA.receiptLines = rcl.data||[]; DATA.fixedCosts = fc.data||[];
  DATA.purchaseItems = pi.data||[];
  DATA.salesImportProfiles = sip.data||[]; DATA.salesImports = si.data||[]; DATA.salesLines = sl.data||[];
  DATA.ingredients = ing.data||[];
  DATA.rosterWorkers = rw.data||[];
  DATA.staffShifts = ss.data||[];
  DATA.eventContracts = ctr.data||[];
}

/* ---------------- AI ASSIST (Gemini via Edge Function) ---------------- */
let lastAIError = '';
async function callAI(task, payload){
  if(!GEMINI_EDGE_FUNCTION_URL || GEMINI_EDGE_FUNCTION_URL === "YOUR_EDGE_FUNCTION_URL") return null;
  try{
    const res = await fetch(GEMINI_EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, ...payload }),
    });
    const text = await res.text();
    let data; try{ data = JSON.parse(text); }catch(_){ data = null; }
    if(!res.ok || !data) throw new Error('HTTP '+res.status+': '+text.slice(0,300));
    if(data.error) throw new Error(data.error);
    lastAIError = '';
    return data;
  }catch(err){
    console.error('AI assist error', err);
    lastAIError = String(err && err.message || err);
    return null;
  }
}

const CATEGORY_KEYWORDS = {
  food: ['food','comida','comidas','alimento','alimentos','plato','platos','snack','snacks','burger','hamburguesa','taco','tacos','arepa','pizza','sandwich','sandwiche','empanada','comida rapida'],
  drinks: ['drink','drinks','bebida','bebidas','beer','cerveja','cerveza','wine','vinho','vino','cocktail','coctel','água','agua','water','soda','refresco','refrigerante','juice','zumo','sumo','cafe','café'],
  other: ['deposit','deposito','caução','caucao','merch','merchandise','ticket','tickets','fee','entrada','other','otro','otros','outro','outros'],
};
function localClassifyCategory(label){
  if(!label) return null;
  const l = String(label).toLowerCase();
  for(const [cat, words] of Object.entries(CATEGORY_KEYWORDS)){
    if(words.some(w=>l.includes(w))) return cat;
  }
  return null;
}
async function classifyCategories(labels){
  const result = {};
  const unresolved = [];
  labels.forEach(label=>{
    const local = localClassifyCategory(label);
    if(local) result[label] = local; else unresolved.push(label);
  });
  if(unresolved.length){
    const ai = await callAI('classify_categories', { labels: unresolved });
    unresolved.forEach(l=>{ result[l] = (ai && ai[l]) || 'other'; });
  }
  return result;
}

function fmt(n){ return '€' + (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
function pct(n){ return isFinite(n) ? (n*100).toFixed(1)+'%' : '—'; }
function uid(){ return crypto.randomUUID(); }

/* ============================================================
   FINANCE MODEL
   Contribution Margin = Revenue − (produce + fee + staff + truck + transport)
   Allocated Fixed Cost = event's revenue share × shared fixed pool
                           + event's own (setup + misc) cost lines
   Operational Margin = Contribution Margin − Allocated Fixed Cost
   ============================================================ */
const DIRECT_CATS = ['produce','fee','staff','truck','transport'];
const FIXED_CATS = ['setup','misc'];
const ALL_CATS = [...DIRECT_CATS, ...FIXED_CATS];

function linesForEvent(eventId, cats){
  const receiptIds = new Set(DATA.receipts.filter(r=>r.event_id===eventId).map(r=>r.id));
  return DATA.receiptLines.filter(l=>receiptIds.has(l.receipt_id) && cats.includes(l.category));
}
function staffCostFor(eventId){
  return rosterForEvent(eventId).reduce((s,w)=>s+workerCost(w),0);
}
/* Staff cost is live, from the hours in Staff. Old "Save as cost" staff entries are ignored so nothing is counted twice. */
function costsFor(eventId, cats){
  const autoStaffIds = new Set(DATA.receipts.filter(r=>autoKind(r)==='staff').map(r=>r.id));
  let total = linesForEvent(eventId, cats).filter(l=>!autoStaffIds.has(l.receipt_id)).reduce((s,l)=>s+Number(l.amount||0),0);
  if(cats.includes('staff')) total += staffCostFor(eventId);
  return total;
}

function sharedReceipts(season){ return DATA.receipts.filter(r=>r.is_shared && r.season===season); }
function sharedLines(season){
  const ids = new Set(sharedReceipts(season).map(r=>r.id));
  return DATA.receiptLines.filter(l=>ids.has(l.receipt_id));
}
function eventLabel(r){
  if(r.is_shared) return 'Shared / all festivals';
  const e = DATA.events.find(x=>x.id===r.event_id);
  return e ? e.name : '(unassigned)';
}

/* One rule for a festival's net revenue everywhere: uploaded sales lines, else manual sales totals, else the legacy field on the event */
function eventRevenue(e){
  const fromLines = salesLinesForEvent(e.id).reduce((s,l)=>s+Number(l.amount_net||0),0);
  return fromLines || Number(e.sales_net_manual||0) || Number(e.revenue||0);
}

/* Each season is computed on its own (its shared pool is split only among its own events); "All seasons" adds the results up */
function computeFinance(){
  const seasons = SEASON_ALL
    ? [...new Set([...DATA.events.map(e=>e.season), ...DATA.receipts.filter(r=>r.is_shared).map(r=>r.season)].filter(Boolean))].sort()
    : [CURRENT_SEASON];
  const out = { rows:[], totalRevenue:0, sharedPool:0, profit:0, result:0 };
  seasons.forEach(season=>{
    const r = computeSeasonFinance(season);
    out.rows.push(...r.rows); out.totalRevenue += r.totalRevenue; out.sharedPool += r.sharedPool;
    const pr = r.rows.reduce((t,x)=>t+x.profit,0);
    out.profit += pr; out.result += pr - r.sharedPool;
  });
  return out;
}
function computeSeasonFinance(season){
  const seasonEvents = DATA.events.filter(e=>e.season===season);
  const totalRevenue = seasonEvents.reduce((s,e)=>s+eventRevenue(e),0);
  const sharedPool = sharedLines(season).reduce((s,l)=>s+Number(l.amount||0),0);
  const rows = seasonEvents.map(e=>{
    const revenue = eventRevenue(e);
    const direct = costsFor(e.id, DIRECT_CATS);
    const cm = revenue - direct;
    const cmPct = revenue ? cm/revenue : NaN;
    const ownFixed = costsFor(e.id, FIXED_CATS);
    const allocatedShared = totalRevenue ? (revenue/totalRevenue)*sharedPool : 0;
    const allocatedFixed = ownFixed + allocatedShared;
    const opm = cm - allocatedFixed;
    const opmPct = revenue ? opm/revenue : NaN;
    const profit = cm - ownFixed;
    const profitPct = revenue ? profit/revenue : NaN;
    return { event:e, revenue, direct, cm, cmPct, ownFixed, allocatedShared, allocatedFixed, profit, profitPct, opm, opmPct };
  });
  return { rows, totalRevenue, sharedPool };
}

function marginPill(pctVal){
  if(!isFinite(pctVal)) return '<span class="pill">—</span>';
  if(pctVal < BAD_OPM) return `<span class="pill bad">${pct(pctVal)}</span>`;
  if(pctVal < WARN_OPM) return `<span class="pill warn">${pct(pctVal)}</span>`;
  return `<span class="pill good">${pct(pctVal)}</span>`;
}

/* ---------------- CONTRACTS (AI analysis) ----------------
   Upload a contract PDF for an event -> Gemini (through the ai-assist Edge Function) extracts the fee rule,
   payment schedule, deliverables and obligations -> you review/edit -> on save the fee rule is written to the
   event (the same fields as the Contract section of the event popup) and the checklist is kept here. */
let contractDraft = null;   // { eventId, fileName, filePath, f:{...fields}, tasks:[], evidence:[], warnings:[], penalties:[] }
let contractBusy = '';
const CTR_MAX_BYTES = 4.5*1024*1024;

function ctrNum(v){ const n = parseFloat(v); return isFinite(n) ? n : null; }
function ctrDate(v){ return (typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null; }
function normalizeContractAI(r){
  r = r || {};
  const f = {
    revenue_model: ['own_sale','service_provision'].includes(r.revenue_model) ? r.revenue_model : 'own_sale',
    fee_model: ['fixed','commission','mixed'].includes(r.fee_model) ? r.fee_model : 'fixed',
    fee_fixed_amount: ctrNum(r.fee_fixed_amount) ?? 0,
    fee_base: ['net','gross'].includes(r.fee_base) ? r.fee_base : '',
    fee_commission_food_pct: ctrNum(r.fee_commission_food_pct) ?? 0,
    fee_commission_drinks_pct: ctrNum(r.fee_commission_drinks_pct) ?? 0,
    price_cap: ctrNum(r.price_cap),
  };
  const tasks = [];
  const withText = (t, txt) => txt ? `${t} (${txt})` : t;
  (r.payment_schedule||[]).forEach(p=>{
    const amt = ctrNum(p.amount);
    tasks.push({ id:uid(), kind:'payment', text: withText(`Pay: ${p.description||'fee installment'}${amt?` — ${fmt2(amt)}`:''}`, !ctrDate(p.due_date) ? p.due_text : null), due: ctrDate(p.due_date), done:false });
  });
  (r.deliverables||[]).forEach(d=>{
    tasks.push({ id:uid(), kind:'deliverable', text: withText(`Deliver: ${d.item||''}`, !ctrDate(d.due_date) ? d.due_text : null), due: ctrDate(d.due_date), done:false });
  });
  (r.key_dates||[]).forEach(k=>{
    tasks.push({ id:uid(), kind:'date', text: withText(k.label||'Key date', !ctrDate(k.date) ? k.date_text : null), due: ctrDate(k.date), done:false });
  });
  (r.obligations||[]).forEach(o=>{ if(o) tasks.push({ id:uid(), kind:'obligation', text:String(o), due:null, done:false }); });
  return { f, tasks, penalties:(r.penalties||[]).map(String), warnings:(r.warnings||[]).map(String), evidence:(r.evidence||[]).filter(x=>x&&(x.quote_en||x.quote_original||x.quote)).map(x=>({field:x.field,clause:x.clause,en:x.quote_en||x.quote||'',orig:x.quote_original||''})) };
}

function readFileBase64(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1]);
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(file);
  });
}

async function analyzeContractFile(){
  const evId = document.getElementById('ctr_event').value;
  const file = document.getElementById('ctr_file').files[0];
  if(!evId){ toast('Choose the event first.'); return; }
  if(!file){ toast('Choose the contract PDF.'); return; }
  if(!/\.pdf$/i.test(file.name)){ toast('Only PDF files are supported. Export the contract to PDF first.'); return; }
  if(file.size > CTR_MAX_BYTES){ toast('That PDF is larger than 4.5 MB. Compress it or send only the pages with the terms.'); return; }
  contractBusy = 'Uploading and reading the contract. This can take up to a minute…'; renderContracts();
  try{
    const b64 = await readFileBase64(file);
    const safe = file.name.replace(/[^\w.\-]+/g,'_');
    const path = `${evId}/${Date.now()}_${safe}`;
    const up = await sb.storage.from('contracts').upload(path, file, { contentType:'application/pdf' });
    if(up.error) throw new Error('Could not store the PDF ('+up.error.message+'). Did you run the contracts SQL?');
    const ai = await callAI('analyze_contract', { pdf_base64:b64, filename:file.name });
    if(!ai) throw new Error('The AI function did not answer.\n\nDetail: '+(lastAIError||'no response')+'\n\nCheck that ai-assist was redeployed with the contract task and that GEMINI_API_KEY is set.');
    contractDraft = Object.assign({ eventId:evId, fileName:file.name, filePath:path }, normalizeContractAI(ai));
    contractBusy = '';
  }catch(err){
    contractBusy = ''; contractDraft = null;
    toast(err.message || String(err));
  }
  renderContracts();
}

    const tasks = c.tasks||[];

          <div class="small muted">Fee rule: ${esc(rule||'—')} · ${open} of ${tasks.length} items open</div></div>
        <div style="display:flex;gap:6px"><button onclick="openContractPdf('${c.id}')">Open PDF</button><button onclick="deleteContract('${c.id}')">Delete</button></div>
      </div>

        const late = !t.done && t.due && t.due < today;

/* ---- Compare festivals (Finance, All festivals view) ---- */
function festivalCompareData(r){
  const e = r.event;
  const lines = salesLinesForEvent(e.id);
  const extra = new Set(extraDaysOf(e));
  const days = [...new Set(lines.filter(l=>l.occurred_at).map(dayKey))];
  const festDays = days.filter(d=>!extra.has(d)).length;
  let bowls = 0, dishGross = 0, netFest = 0, bowlsFest = 0;
  lines.forEach(l=>{
    const q = Number(l.qty||0), g = Number(l.amount_gross||0), c = classifySale(l.product_name, q, g);
    const fest = !(l.occurred_at && extra.has(dayKey(l)));
    if(fest) netFest += Number(l.amount_net||0);
    if(c==='bowl'){ bowls += q; if(fest) bowlsFest += q; }
    if(c==='bowl' || c==='protein') dishGross += g;
  });
  const produceLines = linesForEvent(e.id, ['produce']);
  const isDrink = l => { const rc = DATA.receipts.find(x=>x.id===l.receipt_id); return !!(rc && DRINK_VENDORS.test(vendorName(rc.vendor_id)||'')); };
  const produce = costsFor(e.id, ['produce']);
  const drinksBought = produceLines.filter(isDrink).reduce((t,l)=>t+Number(l.amount||0),0);
  const fa = feeAnalysis(e);
  const retained = (!fa.own && fa.retained>0) ? fa.retained : 0;
  const varFee = (fa.set && fa.expected>0 && fa.commPart>0) ? fa.invoiced * (fa.commPart/fa.expected) : 0;
  const V = produce + varFee;                        // costs that grow with sales
  const F = (r.direct - V) + r.allocatedFixed;       // costs that do not: fixed fee, staff, truck, transport, setup, shared share
  const rev = r.revenue;
  const beSales = (rev>0 && V<rev) ? F/(1 - V/rev) : NaN;
  const safety = isFinite(beSales) && rev>0 ? (rev-beSales)/rev : NaN;
  const bePerBowl = bowls>0 ? rev/bowls : NaN;
  const beBowls = (isFinite(beSales) && bowls>0) ? beSales/bePerBowl : NaN;
  const econCost = r.direct + retained, econRev = rev + retained;
  return {
    e, rev, bowls, festDays, netPerDay: festDays>0 && lines.length ? netFest/festDays : NaN,
    bowlsPerDay: festDays>0 && bowls>0 ? bowlsFest/festDays : NaN,
    dish: bowls>0 ? dishGross/bowls : NaN,
    ingPerBowl: bowls>0 ? (produce-drinksBought)/bowls : NaN,
    costPerBowl: bowls>0 ? (econCost-drinksBought)/bowls : NaN,
    costPct: econRev>0 ? econCost/econRev : NaN,
    feePct: fa.set ? fa.effective : NaN,
    marginPerBowl: bowls>0 ? r.cm/bowls : NaN,
    cmPct: r.cmPct, opm: r.opm, opmPct: r.opmPct, profit: r.profit, profitPct: r.profitPct,
    direct: r.direct, cm: r.cm, ownFixed: r.ownFixed, share: r.allocatedShared,
    beSales, safety, beBowls, F, V
  };
}
function cbChart(items, opts){
  opts = opts || {};
  const vals = items.map(i=>i.value).filter(v=>isFinite(v));
  if(!vals.length) return '<div class="small muted">No data yet.</div>';
  const hi = Math.max(0, ...vals, ...items.map(i=>isFinite(i.value2)?i.value2:0)), lo = Math.min(0, ...vals);
  const range = (hi-lo) || 1, zero = -lo/range*100;
  const bar = (v, cls) => {
    if(!isFinite(v)) return '';
    const l = v>=0 ? zero : zero + v/range*100, w = Math.abs(v)/range*100;
    return `<div class="bar ${cls||''} ${v<0?'neg':''}" style="left:${l.toFixed(2)}%;width:${Math.max(w,0.6).toFixed(2)}%"></div>`;
  };
  return items.map(i=>`
    <div class="cb"><div class="lab" title="${esc(i.label)}">${esc(i.label)}</div>
      <div class="tr" data-tip="${esc(i.tip||'')}">${lo<0?`<div class="zero" style="left:${zero.toFixed(2)}%"></div>`:''}${bar(i.value)}${isFinite(i.value2)?`<div class="mk" style="left:${(zero+i.value2/range*100).toFixed(2)}%"></div>`:''}</div>
      <div class="v">${isFinite(i.value)?opts.fmt(i.value):'—'}</div></div>`).join('');
}
function festivalCompareHtml(rows, tot){
  if(!rows.length) return '';
  const ds = rows.slice().sort((a,b)=>(a.event.start_date||'').localeCompare(b.event.start_date||'')).map(festivalCompareData);
  const n = (v,f)=> isFinite(v) ? f(v) : '—';
  const sg = (v,f)=> v<0 ? '\u2212'+f(-v) : f(v);
  const eur = v=>sg(v,fmt), eur2 = v=>sg(v,fmt2), pc = v=>sg(v,x=>pct(x)), num = v=>Math.round(v).toLocaleString('en-US');
  const name = d => esc(SEASON_ALL ? d.e.name : d.e.name.replace(/\s*20\d\d\s*$/,''));
  const sumOf = get => { const v = ds.map(get).filter(x=>isFinite(x)); return v.length ? v.reduce((a,b)=>a+b,0) : NaN; };
  const sumRev = sumOf(d=>d.rev), sumProfit = sumOf(d=>d.profit), sumOpm = sumOf(d=>d.opm);
  const metric = (label, get, f, hint, total) => `<tr><td${hint?` title="${esc(hint)}"`:''}>${label}</td>${ds.map(d=>`<td>${n(get(d),f)}</td>`).join('')}<td class="tot">${total===undefined?'':n(total,f)}</td></tr>`;
  const section = t => `<tr class="totalrow"><td colspan="${ds.length+2}">${t}</td></tr>`;
  const table = `
    <div class="tblwrap" style="max-height:none"><table class="cmp" data-nosort><thead><tr><th>Metric</th>${ds.map(d=>`<th><a href="#" title="Open costs for this festival" onclick="openEventDetail('${d.e.id}','gastos');return false">${name(d)}</a></th>`).join('')}<th>Total</th></tr></thead><tbody>
      ${section('Sales')}
      ${metric('Net sales', d=>d.rev, eur, '', sumRev)}
      ${metric('Festival days with sales', d=>d.festDays||NaN, num, 'Days marked as extra days are left out', sumOf(d=>d.festDays||NaN))}
      ${metric('Net sales per day', d=>d.netPerDay, eur)}
      ${metric('Bowls sold', d=>d.bowls||NaN, num, '', sumOf(d=>d.bowls||NaN))}
      ${metric('Bowls per day', d=>d.bowlsPerDay, num)}
      ${metric('Average price per dish (gross)', d=>d.dish, eur2, 'Bowl plus the protein sold with it')}
      ${section('Costs')}
      ${metric('Ingredients per bowl', d=>d.ingPerBowl, eur2, 'Excludes drinks bought for resale')}
      ${metric('Total cost per bowl', d=>d.costPerBowl, eur2, 'Direct costs, plus the commission withheld by the organizer when there is one')}
      ${metric('Cost as % of sales', d=>d.costPct, pc)}
      ${metric('Festival fee as % of sales', d=>d.feePct, pc, 'Fee invoiced plus commission withheld, over public sales')}
      ${section('Results')}
      ${metric('Direct costs', d=>d.direct, eur, 'Ingredients, fee, staff, truck and transport', sumOf(d=>d.direct))}
      ${metric('Contribution margin', d=>d.cm, eur, 'Net sales minus direct costs', sumOf(d=>d.cm))}
      ${metric('Contribution margin %', d=>d.cmPct, pc, '', sumRev>0 ? sumOf(d=>d.cm)/sumRev : NaN)}
      ${metric('Margin per bowl', d=>d.marginPerBowl, eur2, 'Contribution margin divided by bowls')}
      ${metric('Own setup and misc', d=>d.ownFixed, eur, 'Setup and misc costs booked to this festival', sumOf(d=>d.ownFixed))}
      ${metric('Festival profit', d=>d.profit, eur, 'Net sales minus direct costs and the festival\'s own setup and misc. Pre-season costs are not included.', sumProfit)}
      ${metric('Festival profit %', d=>d.profitPct, pc, 'Festival profit over net sales', sumRev>0 ? sumProfit/sumRev : NaN)}
      ${metric('Share of pre-season costs', d=>d.share, eur, 'Pre-season costs split by each festival\'s share of the season\'s revenue', sumOf(d=>d.share))}
      ${metric('Operating margin', d=>d.opm, eur, 'Festival profit minus its share of pre-season costs', sumOpm)}
      ${metric('Operating margin %', d=>d.opmPct, pc, '', sumRev>0 ? sumOpm/sumRev : NaN)}
      ${HAS_CONTRACT_COLS() ? `<tr><td title="Does the fee invoiced match the contract?">Fee check</td>${ds.map(d=>`<td>${feeCheckPill(d.e)}</td>`).join('')}<td class="tot"></td></tr>` : ''}
      ${section('Break-even')}
      ${metric('Break-even net sales', d=>d.beSales, eur, 'Fixed costs divided by (1 minus variable costs as a share of sales)')}
      ${metric('Break-even bowls', d=>d.beBowls, num, 'Break-even sales at this festival\'s average net sales per bowl')}
      ${metric('Cushion over break-even', d=>d.safety, pc, 'How far sales could fall before the festival stops covering its costs')}
    </tbody></table></div>`;
  const charts = `
    <div class="cmp-grid">
      <div><h4>Net sales per festival day</h4><span class="bi-q">Extra days left out</span>
        ${cbChart(ds.map(d=>({label:d.e.name, value:d.netPerDay, tip:`${d.e.name}: ${n(d.netPerDay,eur)} per day over ${d.festDays} days`})), {fmt:eur})}</div>
      <div><h4>Cost as % of sales</h4><span class="bi-q">Lower is better</span>
        ${cbChart(ds.map(d=>({label:d.e.name, value:d.costPct, tip:`${d.e.name}: ${n(d.costPct,pc)}`})), {fmt:pc})}</div>
      <div><h4>Operating margin %</h4><span class="bi-q">After the festival's share of shared costs</span>
        ${cbChart(ds.map(d=>({label:d.e.name, value:d.opmPct, tip:`${d.e.name}: ${n(d.opm,eur)} (${n(d.opmPct,pc)})`})), {fmt:pc})}</div>
      <div><h4>Net sales against break-even</h4><span class="bi-q">Bar: what was sold. Dark line: sales needed to break even.</span>
        ${cbChart(ds.map(d=>({label:d.e.name, value:d.rev, value2:d.beSales, tip:`${d.e.name}: sold ${eur(d.rev)}, break-even ${n(d.beSales,eur)}`})), {fmt:eur})}</div>
    </div>`;
  const cards = `
    <div class="cards">
      ${ds.map(d=>`<div class="card"><div class="label">${name(d)}</div><div class="num ${d.profit<0?'neg':''}">${eur(d.profit)}</div>
        <div class="sub2">Festival profit${isFinite(d.profitPct)?' · '+pc(d.profitPct)+' of sales':''}</div>
        <div class="sub2">After pre-season share: ${eur(d.opm)}</div></div>`).join('')}
    </div>`;
  return `
    <div class="panel">
      <div class="bi-title"><h3>Compare festivals</h3><span class="bi-q">Season figures side by side. Per-bowl and per-day figures need imported sales lines, so festivals with manual totals show dashes there.</span></div>
      ${cards}
      ${table}
      ${charts}
      <div class="small muted" style="margin-top:12px">Break-even: costs that grow with sales are ingredients and any commission-based fee; everything else (fixed fee, staff, truck, transport, setup and the share of shared costs) is treated as fixed. Break-even sales = fixed costs ÷ (1 − variable costs ÷ sales). It assumes the sales mix stays the same.</div>
    </div>`;
}

function receiptSeasonOf(r){
  if(r.is_shared) return r.season;
  const e = DATA.events.find(x=>x.id===r.event_id);
  return e ? e.season : r.season;
}
/* Gross amounts paid (incl. IVA) grouped by who paid; legacy auto fee/staff rows are not real invoices */
function advancesBy(receipts){
  const out = { rodrigo:0, zac:0, moche:0, none:0, net:{ rodrigo:0, zac:0, moche:0, none:0 } };
  receipts.filter(r=>!autoKind(r)).forEach(r=>{
    const sm = receiptSummary(r);
    const k = ['rodrigo','zac','moche'].includes(r.paid_by) ? r.paid_by : 'none';
    out[k] += sm.gross; out.net[k] += sm.net;
  });
  return out;
}

/* Opens every stored page of an invoice together in one new tab (temporary private links) */
async function openInvoiceFiles(receiptId){
  const r = DATA.receipts.find(x=>x.id===receiptId);
  const paths = (r && r.receipt_files) || [];
  if(!paths.length) return;
  const w = window.open('', '_blank');
  if(!w){ toast('The browser blocked the new tab. Allow pop-ups for this site and try again.'); return; }
  w.document.write('<title>Invoice</title><p style="font:14px sans-serif">Loading invoice…</p>');
  const urls = [];
  for(const path of paths){
    const { data, error } = await sb.storage.from('invoices').createSignedUrl(path, 3600);
    if(error || !data){ w.document.body.innerHTML = '<p style="font:14px sans-serif">Could not open '+esc(path)+': '+esc(error?error.message:'no link')+'</p>'; return; }
    urls.push({ path, url:data.signedUrl });
  }
  const title = esc((r.invoice_number||'Invoice')+' · '+vendorName(r.vendor_id));
  const pages = urls.map((u,i)=> /\.pdf$/i.test(u.path)
    ? `<iframe src="${u.url}" style="width:100%;height:95vh;border:0;background:#fff"></iframe>`
    : `<img src="${u.url}" style="max-width:100%;display:block;margin:0 auto;background:#fff">`
    + '').join('<hr style="margin:14px 0;border:0;border-top:1px solid #999">');
  w.document.open();
  w.document.write(`<!doctype html><meta charset="utf-8"><title>${title}</title><body style="margin:0;padding:12px;background:#ddd;font:14px sans-serif"><div style="margin-bottom:10px"><b>${title}</b> · ${urls.length} page${urls.length===1?'':'s'}</div>${pages}</body>`);
  w.document.close();
}

async function resolveOrCreateVendor(name){
  const existing = DATA.vendors.map(v=>({ id:v.id, name:v.name, aliases:v.aliases||[] }));
  const match = existing.length ? await callAI('match_vendor', { name, existingVendors: existing }) : null;
  if(match && match.matchId && (match.confidence==='high' || match.confidence==='medium')){
    const matched = DATA.vendors.find(v=>v.id===match.matchId);
    if(matched){
      const useExisting = await askConfirm(`"${name}" looks like the same supplier as "${matched.name}", already on file (confidence: ${match.confidence}). Use "${matched.name}"?`);
      if(useExisting){
        if(!(matched.aliases||[]).includes(name)){
          await sb.from('vendors').update({ aliases: [...(matched.aliases||[]), name] }).eq('id', matched.id);
        }
        return matched.id;
      }
    }
  }
  const { data: newVendor } = await sb.from('vendors').insert({ name }).select();
  const id = newVendor && newVendor[0] && newVendor[0].id;
  if(!id) toast('Could not create supplier.');
  return id;
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt2(n){ return '€' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
const PAID_BY = { rodrigo:'Rodrigo', zac:'Zac', moche:'Moche Verde' };
function autoKind(r){
  const src = r.source || (r.note==='__auto_fee__' ? 'auto_fee' : r.note==='__auto_staff__' ? 'auto_staff' : '');
  return src==='auto_fee' ? 'fee' : src==='auto_staff' ? 'staff' : null;
}
function quarterOf(d){
  if(!d) return '—';
  const p = d.split('-');
  return 'Q' + Math.ceil(Number(p[1])/3) + ' ' + p[0];
}
function receiptSummary(r){
  const lines = DATA.receiptLines.filter(l=>l.receipt_id===r.id);
  const cats = [...new Set(lines.map(l=>l.category))];
  const gross = lines.length ? lines.reduce((s,l)=>s+Number(l.amount_gross ?? l.amount ?? 0),0) : Number(r.amount_gross||0);
  const net = lines.reduce((s,l)=>s+Number(l.amount||0),0);
  const iva = lines.reduce((s,l)=>s+Number(l.iva_amount||0),0);
  const byRate = {};
  lines.forEach(l=>{ if(Number(l.iva_amount)>0){ const k=Number(l.iva_rate||0); byRate[k]=(byRate[k]||0)+Number(l.iva_amount); } });
  const ivaTip = Object.entries(byRate).sort((a,b)=>a[0]-b[0]).map(([k,v])=>`${k}%: ${fmt2(v)}`).join(' · ');
  const rated = lines.filter(l=>Number(l.iva_rate)>0);
  const dedYes = rated.filter(l=>l.iva_deductible).length;
  const deductible = !rated.length ? '—' : dedYes===rated.length ? 'Yes' : dedYes===0 ? 'No' : 'Mixed';
  return { lines, cats, gross, net, iva, ivaTip, deductible };
}

let invSeq = 0;
/* Search box over an invoice table: hides non-matching rows in the browser and re-adds the visible totals */
function invFilter(uid, q){
  const root = document.getElementById(uid); if(!root) return;
  const terms = String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  let g=0,n=0,i=0,shown=0,all=0;
  root.querySelectorAll('tbody tr[data-q]').forEach(tr=>{
    all++;
    const ok = terms.every(t=>tr.dataset.q.includes(t));
    tr.style.display = ok ? '' : 'none';
    if(ok){ shown++; g+=Number(tr.dataset.g||0); n+=Number(tr.dataset.n||0); i+=Number(tr.dataset.i||0); }
  });
  const f = v=>'€'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const set = (c,t)=>{ const el = root.querySelector('.'+c); if(el) el.textContent = t; };
  set('tg',f(g)); set('tn',f(n)); set('ti',f(i));
  set('tc', (terms.length ? `Showing ${shown} of ${all}` : 'Total')+` · ${terms.length?shown:all} invoice${(terms.length?shown:all)===1?'':'s'}`);
  const none = root.querySelector('.invnone'); if(none) none.style.display = (all && !shown) ? '' : 'none';
}

      <td>${r.paid_by?PAID_BY[r.paid_by]:'—'}</td>

      <td style="white-space:nowrap">${r.status==='needs_review' ? `<button onclick="markReviewed('${r.id}','${delKey}')" title="Mark as reviewed">Reviewed</button> ` : `<button onclick="flagForReview('${r.id}','${delKey}')" title="Flag this invoice for review">Flag</button> `}<button onclick="openExpenseModal('${r.id}'${editOpts})">Edit</button>

      <div class="catchips">${(opts.staffCost ? `<div class="catchip">staff<b>${fmt2(opts.staffCost)}</b>from Staff hours</div>` : '') + Object.entries(catTotals).map(([c,v])=>`<div class="catchip">${c}<b>${fmt2(v.net)}</b>${v.n} invoice${v.n===1?'':'s'}</div>`).join('') || '<div class="small muted">No expenses in this selection.</div>'}</div>
      <div class="invsearch"><input type="search" id="${uid}_q" placeholder="Search invoices: supplier, ID, note, category, payer, amount, date" oninput="invFilter('${uid}',this.value)" autocomplete="off"></div>

      </tbody></table></div></div>`;
}

/* ---- Edit-invoice modal: one category, one or more (gross amount + IVA rate) rows ---- */
let exState = null;
function exCalc(row){
  const rate = Number(row.rate)||0;
  return rate>0 ? Math.round((row.gross - row.gross/(1+rate/100))*100)/100 : 0;
}
function exIvaOf(row){ return row.manual ? Number(row.iva)||0 : exCalc(row); }
function exRowsHtml(){
  return exState.rows.map((row,i)=>`<div class="exrow">
    <div><label>${i===0?'Gross amount €':'&nbsp;'}</label><input type="number" step="0.01" value="${row.gross||''}" oninput="exGross(${i},this.value)"></div>
    <div><label>${i===0?'IVA rate':'&nbsp;'}</label><select onchange="exRate(${i},this.value)">
      ${[23,13,6,0].map(v=>`<option value="${v}" ${Number(row.rate)===v?'selected':''}>${v?v+'%':'0% / exempt'}</option>`).join('')}</select></div>
    <div><label>${i===0?'IVA amount € (editable)':'&nbsp;'}</label><input id="ex_iva_${i}" type="number" step="0.01" value="${exIvaOf(row).toFixed(2)}" oninput="exIva(${i},this.value)" ${exState.ded?'':'disabled'}></div>
    <div>${exState.rows.length>1?`<button class="danger" onclick="exRemoveRow(${i})">×</button>`:''}</div>
  </div>`).join('');
}
function exRefreshRows(){ document.getElementById('ex_rows').innerHTML = exRowsHtml(); exTotals(); }
function exTotals(){
  const g = exState.rows.reduce((s,r)=>s+(Number(r.gross)||0),0);
  const iva = exState.ded ? exState.rows.reduce((s,r)=>s+exIvaOf(r),0) : 0;
  document.getElementById('ex_total').innerHTML = `Invoice total: <b>${fmt2(g)}</b> · IVA deducted: ${fmt2(iva)} · Net cost: ${fmt2(g-iva)}`;
}
function exGross(i,v){ const r=exState.rows[i]; r.gross=parseFloat(v)||0; if(!r.manual){ document.getElementById('ex_iva_'+i).value=exCalc(r).toFixed(2); } exTotals(); }
function exRate(i,v){ const r=exState.rows[i]; r.rate=Number(v); r.manual=false; document.getElementById('ex_iva_'+i).value=exCalc(r).toFixed(2); exTotals(); }
function exIva(i,v){ const r=exState.rows[i]; r.manual=true; r.iva=parseFloat(v)||0; exTotals(); }
function exAddRow(){ exState.rows.push({gross:0,rate:23,iva:0,manual:false}); exRefreshRows(); }
function exRemoveRow(i){ exState.rows.splice(i,1); exRefreshRows(); }
function exToggleDed(v){ exState.ded=v; exRefreshRows(); }

function nextInternalId(dateStr){
  const yr = (dateStr || new Date().toISOString().slice(0,10)).slice(0,4);
  const re = new RegExp('^MV-'+yr+'-(\\d+)$');
  let max = 0;
  DATA.receipts.forEach(r=>{ const m = re.exec(r.invoice_number||''); if(m) max = Math.max(max, Number(m[1])); });
  return 'MV-'+yr+'-'+String(max+1).padStart(4,'0');
}
function exDateChanged(){

  if(!rows.length) rows.push(pre.gross ? {gross:pre.gross, rate:pre.rate ?? 23, iva:0, manual:false} : {gross:0,rate:23,iva:0,manual:false});

async function saveExpense(){
  const s = exState;
  const isNew = !s.receiptId;
  let vendor_id = document.getElementById('ex_vendor').value;
  if(!vendor_id){ toast('Select or create a supplier.'); return; }
  const expense_date = document.getElementById('ex_date').value;
  if(!expense_date){ toast('The invoice date is required (it sets the quarter).'); return; }
  const invoice_number = document.getElementById('ex_id').value.trim() || null;
  if(invoice_number && DATA.receipts.some(x=>x.id!==s.receiptId && x.invoice_number===invoice_number)){
    toast('Another invoice already uses the internal ID "'+invoice_number+'".'); return;
  }
  const paid_by = document.getElementById('ex_paid').value || null;
  if(!paid_by){ toast('Select who paid this invoice (Rodrigo, Zac or Moche Verde).'); return; }
  const note = document.getElementById('ex_note').value.trim() || null;
  if(vendor_id==='__new__'){
    const name = document.getElementById('ex_vendor_new').value.trim();
    if(!name){ toast('Enter the new supplier\'s name.'); return; }
    vendor_id = await resolveOrCreateVendor(name);
    if(!vendor_id) return;
  }
  const header = { vendor_id, expense_date, invoice_number, paid_by, note, buyer_nif: document.getElementById('ex_buyer').value || null };
  if(s.shared){ header.is_shared = true; header.season = document.getElementById('ex_season').value; }

  let lines = null;
  if(!s.locked){
    const rows = s.rows.filter(r=>Number(r.gross)>0);
    if(!rows.length){ toast('Enter at least one amount.'); return; }
    const category = document.getElementById('ex_cat').value;
    const ded = s.ded;
    lines = rows.map(r=>{
      const iva = ded && Number(r.rate)>0 ? exIvaOf(r) : 0;
      return { category, amount: r.gross - iva, amount_gross: r.gross,
               iva_rate: r.rate, iva_amount: iva, iva_deductible: ded };
    });
    const gross = lines.reduce((t,l)=>t+l.amount_gross,0);
    const ivaTot = lines.reduce((t,l)=>t+l.iva_amount,0);
    Object.assign(header, { amount_gross: gross, iva_total: ivaTot, amount_net: gross-ivaTot });
  }

  if(isNew){
    Object.assign(header, { event_id:s.shared ? null : s.eventId, status:'confirmed', source:'manual' });
    let ins = await sb.from('receipts').insert(header).select();
    if(ins.error && ins.error.code==='23505'){            // ID taken meanwhile (e.g. by the Discord bot): let the database assign the next one
      header.invoice_number = null;
      ins = await sb.from('receipts').insert(header).select();
    }
    if(ins.error || !ins.data || !ins.data[0]){ toast('Could not save invoice: '+(ins.error?ins.error.message:'unknown error')); return; }
    const newId = ins.data[0].id;
    const li = await sb.from('receipt_lines').insert(lines.map(l=>({...l, receipt_id:newId})));
    if(li.error){ await sb.from('receipts').delete().eq('id', newId); toast('Could not save amounts: '+li.error.message); return; }
  } else {
    if(lines){
      const oldIds = DATA.receiptLines.filter(l=>l.receipt_id===s.receiptId).map(l=>l.id);
      const ins = await sb.from('receipt_lines').insert(lines.map(l=>({...l, receipt_id:s.receiptId})));
      if(ins.error){ toast('Could not save amounts: '+ins.error.message); return; }
      if(oldIds.length) await sb.from('receipt_lines').delete().in('id', oldIds);
    }
    header.status = 'confirmed';   // editing an invoice counts as reviewing it
    const up = await sb.from('receipts').update(header).eq('id', s.receiptId);
    if(up.error){ toast('Could not save invoice: '+up.error.message); return; }
  }
  closeModal();
  await loadAll();
  if(s.returnTo==='reports') renderReports();
  else if(s.returnTo==='finance') showPage('finance');
  else openEventDetail(s.eventId, 'gastos');
}

/* ---------------- STAFF ---------------- */
function rosterForEvent(eventId){
  return DATA.rosterWorkers.filter(w=>w.event_id===eventId);
}
function shiftsForWorker(workerId){
  return DATA.staffShifts.filter(s=>s.roster_worker_id===workerId);
}
function openShiftFor(workerId){
  return DATA.staffShifts.find(s=>s.roster_worker_id===workerId && !s.clock_out) || null;
}
function hoursBetween(a,b){ return Math.max(0,(new Date(b)-new Date(a))/3600000); }
function workerHours(workerId){
  const shifts = shiftsForWorker(workerId);
  return shifts.reduce((s,sh)=>s+hoursBetween(sh.clock_in, sh.clock_out||new Date()), 0);
}
function workerCost(w){ return workerHours(w.id)*Number(w.hourly_rate||0) + Number(w.bonus||0); }
function fmtTime(ts){ return ts ? new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : ''; }

/* ---- Shift editor ---- */
function toLocalInput(ts){
  if(!ts) return '';
  const d = new Date(ts); const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fromLocalInput(v){ return v ? new Date(v).toISOString() : null; }
function fmtShiftDay(ts){ return new Date(ts).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}); }
function openShiftsModal(workerId, addMode){
  const w = DATA.rosterWorkers.find(x=>x.id===workerId);
  if(!w) return;
  const shifts = shiftsForWorker(workerId).slice().sort((a,b)=>new Date(a.clock_in)-new Date(b.clock_in));
  const roleSel = (id,val)=>`<select id="${id}" style="width:90px"><option value="front" ${val==='front'?'selected':''}>front</option><option value="back" ${val==='back'?'selected':''}>back</option></select>`;
  const rows = shifts.map(s=>{
    const open = !s.clock_out;
    return `<tr>
      <td class="small">${fmtShiftDay(s.clock_in)}</td>
      <td><input id="sh_in_${s.id}" type="datetime-local" value="${toLocalInput(s.clock_in)}"></td>
      <td>${open ? '<span class="muted small">running</span>' : `<input id="sh_out_${s.id}" type="datetime-local" value="${toLocalInput(s.clock_out)}">`}</td>
      <td>${roleSel('sh_role_'+s.id, s.role)}</td>
      <td>${open ? '' : hoursBetween(s.clock_in,s.clock_out).toFixed(2)}</td>
      <td style="white-space:nowrap"><button onclick="saveShift('${s.id}','${workerId}')">Save</button> <button class="danger" onclick="deleteShift('${s.id}','${workerId}')">×</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="muted">No shifts yet.</td></tr>';
  document.getElementById('modalTitle').textContent = `Shifts — ${w.name}`;
  document.getElementById('modalBody').innerHTML = `
    <div style="overflow-x:auto"><table><thead><tr><th>Day</th><th>Clock in</th><th>Clock out</th><th>Role</th><th>Hours</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="small muted" style="margin:8px 0">Total: ${workerHours(workerId).toFixed(2)} hours, ${fmt(workerCost(w))}. Changes recalculate the festival's staff cost.</div>
    <h3 style="margin:14px 0 6px">+ Add shift</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
      <div><label>Clock in</label><input id="sh_new_in" type="datetime-local"></div>
      <div><label>Clock out</label><input id="sh_new_out" type="datetime-local"></div>
      <div><label>Role</label>${roleSel('sh_new_role', w.role||'front')}</div>
      <button class="primary" onclick="addShift('${workerId}')">Add</button>
    </div>
    <div id="shErr" class="small" style="color:#c0392b;margin-top:8px"></div>`;
  openModal();
}
function shiftErr(msg){ const el=document.getElementById('shErr'); if(el) el.textContent=msg; }
function validateShift(inV, outV){
  if(!inV) return 'Clock in is required.';
  if(outV){
    const h = (new Date(outV)-new Date(inV))/3600000;
    if(!(h>0)) return 'Clock out must be after clock in.';
    if(h>16 && !confirm(`This shift is ${h.toFixed(1)} hours long. Save anyway?`)) return 'Cancelled.';
  }
  return null;
}
async function saveShift(id, workerId){
  const s = DATA.staffShifts.find(x=>x.id===id); if(!s) return;
  const inV = document.getElementById('sh_in_'+id).value;
  const outEl = document.getElementById('sh_out_'+id);
  const outV = outEl ? outEl.value : '';
  if(outEl && !outV) return shiftErr('Clock out is required for a closed shift.');
  const err = validateShift(inV, outV); if(err) return shiftErr(err);
  const payload = { clock_in: fromLocalInput(inV), role: document.getElementById('sh_role_'+id).value };
  if(outEl) payload.clock_out = fromLocalInput(outV);
  const { error } = await sb.from('staff_shifts').update(payload).eq('id', id);
  if(error) return shiftErr(error.message);
  await loadAll(); renderStaffDetail(); openShiftsModal(workerId);
}
async function deleteShift(id, workerId){
  if(!await askConfirm('Delete this shift?')) return;
  const { error } = await sb.from('staff_shifts').delete().eq('id', id);
  if(error) return shiftErr(error.message);
  await loadAll(); renderStaffDetail(); openShiftsModal(workerId);
}
async function addShift(workerId){
  const inV = document.getElementById('sh_new_in').value;
  const outV = document.getElementById('sh_new_out').value;
  if(!outV) return shiftErr('Clock out is required for a manually added shift.');
  const err = validateShift(inV, outV); if(err) return shiftErr(err);
  const { error } = await sb.from('staff_shifts').insert({ roster_worker_id: workerId, role: document.getElementById('sh_new_role').value, clock_in: fromLocalInput(inV), clock_out: fromLocalInput(outV) });
  if(error) return shiftErr(error.message);
  await loadAll(); renderStaffDetail(); openShiftsModal(workerId);
}

function dayOptionsForEvent(e){
  const days = new Set(shiftsForEvent(e.id).map(s=>(s.clock_in||'').slice(0,10)).filter(Boolean));
  if(e.start_date) days.add(e.start_date);
  if(e.end_date) days.add(e.end_date);
  return [...days].sort();
}
function shiftsForEvent(eventId){
  const ids = new Set(rosterForEvent(eventId).map(w=>w.id));
  return DATA.staffShifts.filter(s=>ids.has(s.roster_worker_id));
}
function staffCoverageGrid(eventId, day){
  const workers = rosterForEvent(eventId);
  const shifts = shiftsForEvent(eventId).filter(s=>(s.clock_in||'').slice(0,10)===day);
  if(!shifts.length) return '<div class="small muted">No clocked shifts on this day yet.</div>';
  const workerIds = [...new Set(shifts.map(s=>s.roster_worker_id))]
    .sort((a,b)=>{ const sa=shifts.find(s=>s.roster_worker_id===a).clock_in, sb=shifts.find(s=>s.roster_worker_id===b).clock_in; return sa<sb?-1:1; });
  const cols = workerIds.map(id=>DATA.rosterWorkers.find(w=>w.id===id)).filter(Boolean);
  let minH = Infinity, maxH = -Infinity;
  shifts.forEach(s=>{
    const startH = (new Date(s.clock_in) - new Date(day+'T00:00:00'))/3600000;
    const endH = ((s.clock_out?new Date(s.clock_out):new Date()) - new Date(day+'T00:00:00'))/3600000;
    minH = Math.min(minH, Math.floor(startH)); maxH = Math.max(maxH, Math.ceil(endH));
  });
  minH = Math.max(0, minH-1); maxH = Math.min(30, maxH+1); // cap at day+6h
  const rowCount = maxH-minH;
  const rowLabel = h => {
    const totalMin = Math.round((((h%24)+24)%24) * 60);
    const hh = Math.floor(totalMin/60), mm = totalMin%60;
    return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  };
  const timeLabels = Array.from({length:rowCount},(_,i)=>`<div style="grid-column:1;grid-row:${i+1};font-size:11px;color:var(--ink-3);padding:2px 6px;border-bottom:1px solid var(--border)">${rowLabel(minH+i)}</div>`).join('');
  const blocks = shifts.map(s=>{
    const w = DATA.rosterWorkers.find(x=>x.id===s.roster_worker_id);
    const colIdx = cols.findIndex(c=>c.id===s.roster_worker_id);
    if(!w || colIdx<0) return '';
    const startH = (new Date(s.clock_in) - new Date(day+'T00:00:00'))/3600000;
    const endH = ((s.clock_out?new Date(s.clock_out):new Date()) - new Date(day+'T00:00:00'))/3600000;
    const r1 = Math.round((startH-minH)) + 1, r2 = Math.round((endH-minH)) + 1;
    const color = s.role==='front' ? 'var(--front)' : 'var(--back)';
    const label = `${rowLabel(startH)}–${s.clock_out?rowLabel(endH):'now'}`;
    return `<div style="grid-column:${colIdx+2};grid-row:${r1} / ${Math.max(r2,r1+1)};background:${color};color:#fff;font-size:11px;font-weight:600;padding:4px 6px;border-radius:4px;margin:1px;overflow:hidden" title="${w.name} (${s.role}) ${label}">${label}</div>`;
  }).join('');
  const headerCells = cols.map((w,i)=>`<div style="grid-column:${i+2};grid-row:1;font-size:12px;font-weight:700;padding:4px 6px;border-bottom:2px solid var(--border)">${w.name}</div>`).join('');
  return `
    <div class="small muted" style="margin-bottom:8px"><span style="display:inline-block;width:10px;height:10px;background:var(--front);border-radius:2px;margin-right:4px"></span>Front
      <span style="display:inline-block;width:10px;height:10px;background:var(--back);border-radius:2px;margin:0 4px 0 14px"></span>Back</div>

async function handleSalesFileSelect(eventId, input){
  const file = input.files[0];
  if(!file) return;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
  let headerRowIndex = 0;
  for(let i=0;i<Math.min(aoa.length,25);i++){
    const nonEmpty = (aoa[i]||[]).filter(c=>String(c).trim()!=='').length;
    if(nonEmpty >= 3){ headerRowIndex = i; break; }
  }
  const headers = aoa[headerRowIndex].map(h=>String(h).trim()).filter(h=>h!=='');
  salesImportState = { eventId, fileName:file.name, aoa, headerRowIndex, headers, mapping:null, saveAsProfile:false, profileName:'' };
  renderEventDetail();
  const ai = await callAI('map_columns', { headers });
  if(salesImportState && salesImportState.eventId===eventId && ai){
    salesImportState.mapping = ai;
    renderEventDetail();
  }
}
function updateSalesHeaderRow(eventId, idx){

async function confirmSalesImport(eventId){
  if(!salesImportState || !salesImportState.mapping) return;
  const m = salesImportState.mapping;
  if(!m.product || (!m.amount_net && !m.amount_gross)){ toast('You need to map at least product and one amount (net or gross).'); return; }
  const headerIdx = {};
  salesImportState.headers.forEach((h,i)=>{ headerIdx[h]=i; });
  const dataRows = salesImportState.aoa.slice(salesImportState.headerRowIndex+1).filter(r=>r.some(c=>String(c).trim()!==''));
  const rawLines = dataRows.map(r=>{
    const get = (field)=>{
      const h = m[field];
      if(!h) return null;
      const i = headerIdx[h];
      return i===undefined ? null : r[i];
    };
    return {
      date: get('date'), product: get('product') || '(sin nombre)', category_raw: get('category') || '',
      qty: parseFloat(get('qty'))||1,
      amount_net: get('amount_net')!==null ? (parseFloat(String(get('amount_net')).replace(',','.'))||0) : null,
      amount_gross: get('amount_gross')!==null ? (parseFloat(String(get('amount_gross')).replace(',','.'))||0) : null,
    };
  });
  const uniqueCats = [...new Set(rawLines.map(l=>l.category_raw).filter(Boolean))];
  const classified = uniqueCats.length ? await classifyCategories(uniqueCats) : {};

  let profileId = null;
  if(salesImportState.saveAsProfile){
    const name = salesImportState.profileName || (salesImportState.fileName + ' mapping');
    const { data: profRows } = await sb.from('sales_import_profiles').insert({
      name, event_id: eventId, mapping: { ...m, headerRowIndex: salesImportState.headerRowIndex },
    }).select();
    profileId = profRows && profRows[0] && profRows[0].id;
  }
  const { data: importRows } = await sb.from('sales_imports').insert({
    event_id: eventId, profile_id: profileId, filename: salesImportState.fileName, row_count: rawLines.length,
  }).select();
  const importRow = importRows && importRows[0];
  if(!importRow){ toast('Could not create the import record.'); return; }

  const linesToInsert = rawLines.map(l=>{
    let occurred_at = null;
    if(l.date){ const d = new Date(l.date); if(!isNaN(d)) occurred_at = d.toISOString(); }
    const amount_net = l.amount_net!==null ? l.amount_net : (l.amount_gross||0);
    const amount_gross = l.amount_gross!==null ? l.amount_gross : (l.amount_net||0);
    return {
      event_id: eventId, import_id: importRow.id, product_name: l.product,
      category_raw: l.category_raw, category_normalized: classified[l.category_raw] || 'other',
      qty: l.qty, amount_net, amount_gross, occurred_at,
    };
  });
  for(let i=0;i<linesToInsert.length;i+=500){
    await sb.from('sales_lines').insert(linesToInsert.slice(i,i+500));
  }
  salesImportState = null;
  await loadAll();
  openEventDetail(eventId, 'ventas');
}

/* ---- Sales insights (festival Sales tab) ---- */
function classifySale(name, qty, gross){
  const n = String(name||'');
  if(/^\s*(discount|desconto)/i.test(n) || (Number(gross)<0)) return 'discount';
  if(/dep[oó]sito|cup return|add cup|\bcopos?\b|cau[cç]/i.test(n)) return 'deposit';
  if(/^\s*(extra|double extra)/i.test(n)) return 'extra';
  if(/bowl/i.test(n)) return 'bowl';                                   // a bowl named after its protein (e.g. Tofu Bowl) is still a bowl
  if(/tofu|black bean|watermelon(?!\s*slice)/i.test(n)) return 'protein';   // protein sold apart from the bowl (part of the dish)
  return 'product';
}
const DRINK_VENDORS = /moonboy/i;   // vendors whose invoices are drinks bought for resale, not bowl ingredients
function dayKey(l){ return new Date(l.occurred_at).toISOString().slice(0,10); }
function extraDaysOf(e){ return String(e.extra_days||'').split(',').map(x=>x.trim()).filter(Boolean); }
function fmtDay(k){ const d = new Date(k+'T00:00:00Z'); return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}); }
async function toggleExtraDay(eventId, day){
  const e = DATA.events.find(x=>x.id===eventId); if(!e) return;
  if(!('extra_days' in e)){ toast('Could not save: run the extra-days SQL in Supabase first (alter table events add column if not exists extra_days text;).'); return; }
  const cur = new Set(extraDaysOf(e));
  if(cur.has(day)) cur.delete(day); else cur.add(day);
  const val = [...cur].sort().join(',');
  const r = await sb.from('events').update({ extra_days: val || null }).eq('id', eventId);
  if(r.error){ toast('Could not save ('+r.error.message+'). Did you run the extra-days SQL?'); return; }
  e.extra_days = val || null;
  renderEventDetail();
}
function salesInsightsHtml(e, lines){
  const gross = lines.reduce((s,l)=>s+Number(l.amount_gross||0),0);
  const net = lines.reduce((s,l)=>s+Number(l.amount_net||0),0);
  const dated = lines.filter(l=>l.occurred_at);
  const extra = new Set(extraDaysOf(e));
  const days = [...new Set(dated.map(dayKey))].sort();
  const festDays = days.filter(d=>!extra.has(d));
  const byDay = {}, heat = {}, hourSum = {};
  dated.forEach(l=>{
    const d = dayKey(l), h = new Date(l.occurred_at).getUTCHours(), v = Number(l.amount_gross||0);
    byDay[d] = (byDay[d]||0) + v;
    (heat[d] = heat[d]||{})[h] = ((heat[d]||{})[h]||0) + v;
    if(!extra.has(d)) hourSum[h] = (hourSum[h]||0) + v;
  });
  let dishGross = 0, proteinQty = 0;
  let bowls = 0, bowlsFest = 0, depositNet = 0, depositQty = 0, discGross = 0, discQty = 0;
  const prod = {};
  lines.forEach(l=>{
    const q = Number(l.qty||0), g = Number(l.amount_gross||0), c = classifySale(l.product_name, q, g);
    const isExtraDay = l.occurred_at && extra.has(dayKey(l));
    if(c==='deposit'){ depositNet += g; depositQty += q; return; }
    if(c==='discount'){ discGross += g; discQty += q; return; }
    if(c==='bowl'){ bowls += q; if(!isExtraDay) bowlsFest += q; }
    const k = l.product_name || '(no name)';
    prod[k] = prod[k] || { qty:0, gross:0, kind:c };
    prod[k].qty += q; prod[k].gross += g;
    if(c==='bowl' || c==='protein'){ dishGross += g; if(c==='protein') proteinQty += q; }
  });
  const revenue = eventRevenue(e);
  const direct = costsFor(e.id, DIRECT_CATS);
  const cm = revenue - direct;
  const fa = feeAnalysis(e);
  const retained = (!fa.own && fa.retained>0) ? fa.retained : 0;      // commission the organizer keeps before paying: a real cost, but not an invoice
  const econCost = direct + retained, econRev = revenue + retained;
  const drinksBought = linesForEvent(e.id,['produce']).filter(l=>{ const r = DATA.receipts.find(x=>x.id===l.receipt_id); return r && DRINK_VENDORS.test(vendorName(r.vendor_id)||''); }).reduce((t,l)=>t+Number(l.amount||0),0);
  const bowlCost = econCost - drinksBought;
  const drinksSoldNet = lines.filter(l=>l.category_normalized==='drinks').reduce((t,l)=>t+Number(l.amount_net||0),0);
  const netFest = dated.filter(l=>!extra.has(dayKey(l))).reduce((s,l)=>s+Number(l.amount_net||0),0);
  const nd = festDays.length;
  const per = (v,n)=> n>0 ? v/n : NaN;
  const eur = v => isFinite(v) ? fmt(v) : '—';
  const num1 = v => isFinite(v) ? v.toFixed(0) : '—';
  const eur2 = v => isFinite(v) ? fmt2(v) : '—';
  const dayNote = extra.size ? `${nd} festival day${nd===1?'':'s'}, ${days.length-nd} extra excluded` : `${nd} day${nd===1?'':'s'} with sales`;

  const cards = `
    <div class="bi-cards">
      <div class="card"><div class="label">Sales (gross)</div><div class="num">${fmt(gross)}</div><div class="sub2">with IVA</div></div>
      <div class="card"><div class="label">Sales (net)</div><div class="num">${fmt(net)}</div><div class="sub2">without IVA</div></div>
      <div class="card"><div class="label">Bowls sold</div><div class="num">${num1(bowls)}</div><div class="sub2">all days</div></div>
      <div class="card"><div class="label">Bowls per day</div><div class="num">${num1(per(bowlsFest,nd))}</div><div class="sub2">${dayNote}</div></div>
      <div class="card"><div class="label">Net sales per day</div><div class="num">${eur(per(netFest,nd))}</div><div class="sub2">${dayNote}</div></div>
      <div class="card"><div class="label">Cost per bowl</div><div class="num">${eur2(per(bowlCost,bowls))}</div><div class="sub2">${fmt(bowlCost)}${retained>0?` incl. ${fmt(retained)} withheld`:''}${drinksBought>0?`, excl. ${fmt(drinksBought)} drinks for resale`:''}</div></div>
      <div class="card"><div class="label">Cost as % of sales</div><div class="num">${isFinite(econCost/econRev)?pct(econCost/econRev):'—'}</div><div class="sub2">${retained>0?'of public sales':'of net sales'}</div></div>
      <div class="card"><div class="label">Margin per bowl</div><div class="num">${eur2(per(cm,bowls))}</div><div class="sub2">${fmt(cm)} contribution</div></div>
    </div>`;

  // daily bars
  const maxD = Math.max(1, ...days.map(d=>byDay[d]||0));
  const step = niceStep(maxD);
  const top = Math.ceil(maxD/step)*step;
  const grid = Array.from({length:Math.round(top/step)},(_,k)=>k+1).map(i=>`<div class="grid" style="bottom:${(i*step/top*100).toFixed(1)}%"><span>${fmtK(i*step)}</span></div>`).join('');
  const dailyHtml = days.length ? `
    <div class="panel">
      <div class="bi-title"><h3>Sales per day (gross)</h3><span class="bi-q">Hatched bars are extra days (camping etc.), left out of the per-day averages. Click a day below to switch it.</span></div>
      <div class="vbars">${grid}${days.map(d=>{
        const v = byDay[d]||0, x = extra.has(d);
        return `<div class="vbar ${x?'x':''}" style="height:${(v/top*100).toFixed(1)}%" data-tip="${esc(fmtDay(d))} · ${fmt(v)}${x?' · extra day':''}"></div>`; }).join('')}</div>
      <div class="vlabels">${days.map(d=>`<div>${esc(fmtDay(d).split(' ').slice(0,2).join(' '))}</div>`).join('')}</div>
      <div class="daychips">${days.map(d=>`<button class="${extra.has(d)?'x':''}" onclick="toggleExtraDay('${e.id}','${d}')">${esc(fmtDay(d))} · ${extra.has(d)?'extra day':'festival day'}</button>`).join('')}</div>
    </div>` : '';

  // hourly: average per festival day (bars) + heatmap
  const hours = []; const hs = Object.keys(hourSum).concat(...days.map(d=>Object.keys(heat[d]||{}))).map(Number);
  const hMin = hs.length?Math.min(...hs):0, hMax = hs.length?Math.max(...hs):0;
  for(let h=hMin; h<=hMax; h++) hours.push(h);
  const avgH = h => nd>0 ? (hourSum[h]||0)/nd : (hourSum[h]||0);
  const maxH = Math.max(1, ...hours.map(avgH));
  const stepH = niceStep(maxH), topH = Math.ceil(maxH/stepH)*stepH;
  const gridH = Array.from({length:Math.round(topH/stepH)},(_,k)=>k+1).map(i=>`<div class="grid" style="bottom:${(i*stepH/topH*100).toFixed(1)}%"><span>${fmtK(i*stepH)}</span></div>`).join('');
  const maxCell = Math.max(1, ...days.flatMap(d=>hours.map(h=>(heat[d]||{})[h]||0)));
  const hourlyHtml = hours.length ? `
    <div class="panel">
      <div class="bi-title"><h3>Sales by hour</h3><span class="bi-q">${nd>0?'Average per festival day':'Total'} (gross)</span></div>

      <div class="vlabels">${hours.map(h=>`<div>${String(h).padStart(2,'0')}</div>`).join('')}</div>

      <div class="heat" style="grid-template-columns:104px repeat(${hours.length}, minmax(14px,1fr))">
        <div></div>${hours.map(h=>`<div class="hh">${String(h).padStart(2,'0')}</div>`).join('')}
        ${days.map(d=>`<div class="hl">${esc(fmtDay(d))}${extra.has(d)?' <span class="small" style="margin-left:4px">(extra)</span>':''}</div>`
          + hours.map(h=>{ const v=(heat[d]||{})[h]||0; const a = v>0 ? (0.12+0.88*v/maxCell) : 0;
              return `<div class="hc" ${v>0?`style="background:rgba(47,122,83,${a.toFixed(2)})"`:''} data-tip="${esc(fmtDay(d))} ${String(h).padStart(2,'0')}:00 · ${fmt(v)}"></div>`; }).join('')).join('')}
      </div>
    </div>` : '';

  // products
  const rows = Object.entries(prod).sort((a,b)=>b[1].gross-a[1].gross);
  const maxP = Math.max(1, ...rows.map(r=>r[1].gross));
  const bowlQty = bowls;
  const prodHtml = rows.length ? `
    <div class="panel">
      <div class="bi-title"><h3>Product mix</h3><span class="bi-q">Real products only. Extras show how many per 100 bowls.</span></div>

      </tbody></table>
      <div class="small muted" style="margin-top:8px">Sales base: ${fmt(econRev)}${retained>0?` (what the organizer paid ${fmt(revenue)} plus the ${fmt(retained)} it withheld)`:''}. Setup and shared season costs are not included here, they are allocated in Finance.${drinksBought>0?` Drinks: sold ${fmt(drinksSoldNet)} net, bought ${fmt(drinksBought)}.`:''}</div>
    </div>`;
  return cards + dailyHtml + hourlyHtml + prodHtml + costHtml;
}
function niceStep(max){ const raw = max/4; const p = Math.pow(10, Math.floor(Math.log10(raw||1))); const f = raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function fmtK(v){ return v>=1000 ? '€'+(v/1000).toFixed(v%1000===0?0:1)+'k' : '€'+Math.round(v); }

function renderVentasTab(body, e){
